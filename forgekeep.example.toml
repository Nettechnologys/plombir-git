# ForgeKeep Configuration File
# Copy this to forgekeep.toml and customize for your deployment, then start the
# server with `forgekeep serve --config forgekeep.toml`.
#
# Precedence: CLI arg > this file > built-in default. A key you leave commented
# out falls through to the default; a flag passed on the command line overrides
# whatever this file says.

[server]
repo_root = "./repos"
# Files and directories created by the server default to owner-only, including
# Git/gix and registry writers that do not expose a per-file mode. A backup
# account that reaches this state through a shared group can opt into
# "group-readable" (files 0640, directories 0750); use "group-writable" only
# when that account must also create or replace state (0660/0770). This is the
# baseline for ordinary opens: credential files and database/audit snapshots
# stay 0600, and state roots the server creates itself stay 0700. For shared
# access, pre-create those roots with the intended owner, group and mode; the
# server deliberately never chmods an operator-owned directory.
state_permissions = "owner-only"
http_addr = "0.0.0.0:8080"
ssh_addr = "0.0.0.0:2222"
# host_key = "/path/to/ssh_host_key"
# Maximum decoded package artifact size. npm's base64/JSON and multipart
# envelopes get bounded protocol headroom, so this remains the real artifact
# ceiling for every package manager rather than a smaller npm-only limit.
package_upload_max_mb = 512
# Public URL of this instance, used in SSO callbacks, emails and webhook
# payloads. Set it to whatever your reverse proxy serves — left unset, links
# built by the server point at the address it bound to.
# external_url = "https://git.example.com"
# Seconds allowed for draining in-flight requests and the CI-log queue after
# SIGTERM / ctrl-c before the process is forced down. Raise it if a slow clone
# or a long CI-log flush is being cut off during a rolling restart.
# shutdown_grace_secs = 30
# Repository holding this instance's source code. Every page links
# `<source_url>/tree/<commit>` for the commit the binary was built from (the
# Docker build takes it as FORGEKEEP_SOURCE_COMMIT) — the source offer AGPL §13
# asks of anyone who modifies the code and serves it over a network. Point it at
# your fork if you run a modified build.
# source_url = "https://github.com/Yahook/ForgeKeep"

[database]
url = "sqlite://./forgekeep.db?mode=rwc"

[auth]
# Signs session tokens, PAT-derived tokens and CI job tokens. Generate one with
# `forgekeep gen-secret`. Also settable as FORGEKEEP_JWT_SECRET, which wins.
jwt_secret = "change-me-in-production"

# Encrypts data at rest: TOTP secrets, CI secrets, mirror and LDAP passwords,
# SSO client secrets, OAuth tokens, and this instance's provenance signing key.
# When no explicit key is configured, the server creates this key file on first
# start (mode 0600) and reuses it across restarts. It is independent of the JWT
# signing secret, so rotating jwt_secret is safe without a manual .env step.
# `key_file` defaults beside [server].host_key.
# Also settable as FORGEKEEP_ENCRYPTION_KEY / --encryption-key (env wins).
# encryption_key = "the-secret-your-data-was-encrypted-with"
# key_file = "/path/to/encryption_key"
#
# If this key leaks, stop the server and use `forgekeep rotate-encryption-key
# --old <current> --new <fresh> --dry-run`; re-run with --yes to apply it.
#
# There is no third key to configure here: the Ed25519 key that signs release
# attestations and backs /api/v1/ci/oidc/jwks is established on first start and
# kept in the database, precisely so that rotating `jwt_secret` cannot change
# this instance's public identity. Replace it only with
# `forgekeep rotate-instance-key --yes`, which permanently invalidates every
# attestation signed with the previous key.

# Whether POST /api/v1/users/register accepts new accounts from outside:
#   "open"   — anyone who can reach the endpoint may sign up (the default).
#   "closed" — the endpoint answers 403 before hashing a password or touching
#              the database.
# Also settable as FORGEKEEP_REGISTRATION, which wins. An unrecognised value
# (e.g. "close") fails the start instead of quietly leaving the instance open.
#
# [rate_limit].auth_max below is NOT a substitute: it throttles registration to
# ten accounts a minute, forever. This is the setting that refuses.
#
# Two things "closed" deliberately still allows:
#  * the FIRST account, on an instance that has never had a user — otherwise a
#    closed instance could never be initialised;
#  * LDAP / SSO auto-provision on first login, because the operator who wired a
#    directory into this instance already decided who may have an account.
registration = "open"

# Custom OIDC discovery, token exchange (`client_secret`) and userinfo (Bearer
# access token) require HTTPS by default. A legacy private IdP without TLS must
# be named here by exact HTTP origin; allowing its discovery origin never
# authorizes a different token/userinfo host or port.
allow_insecure_oidc_origins = []
# Example exact origins: ["http://idp.internal.example:8080"]

# LDAP uses certificate-verified LDAPS by default, including when a provider
# selects a custom port. A legacy directory without TLS must be named by its
# exact ldap:// host and port here; neighbouring endpoints remain blocked.
allow_insecure_ldap_endpoints = []
# Example exact endpoints: ["ldap://directory.internal.example:1389"]

[webhooks]
# Optional shared secret for verifying HMAC-SHA256 signatures on *inbound*
# external webhooks (POST /api/v1/repos/{owner}/{name}/webhooks/external/*).
# When set, the request must carry an `X-Hub-Signature-256: sha256=<hex>` header
# whose HMAC over the raw body matches (constant-time check) — defense-in-depth
# on top of the JWT/PAT the endpoint already requires. Leave unset to keep the
# endpoint auth-only. The FORGEKEEP_EXTERNAL_WEBHOOK_SECRET env var overrides this.
# external_secret = "change-me-shared-with-your-ci"
# Outbound webhook payloads and their X-Hub-Signature-256 value require HTTPS
# by default. Enable plaintext HTTP only for an operator-controlled development
# network where TLS termination is deliberately unavailable; this does not
# relax the private/loopback/link-local SSRF checks.
allow_insecure_http = false

[ci]
docker = false
# Accept jobs from runners registered with `forgekeep-runner register`, i.e.
# execution on a separate machine. Off means this instance only runs the jobs
# it can execute itself (Docker, or the host shell below).
external_runners = false
# Run imageless CI jobs as a shell directly on the host. Keep false on shared or
# public instances: with it off, every job must use a Docker image or a dedicated
# runner, so pushed CI config cannot execute arbitrary code on the server.
allow_host_runner = false
# Labels the in-process runner answers to, for a job's `tags:` / `runs-on:`.
# The default claims the spellings an Actions workflow carries as boilerplate,
# so those keep running here; anything else — `my-gpu-box`, `windows-latest`,
# and yes `linux` / `x64` — is refused by name instead of being run here anyway.
# Add what this machine really is; an empty list answers to nothing, so every
# job that declares a label is refused.
# runner_labels = ["self-hosted", "ubuntu-latest", "ubuntu-24.04", "ubuntu-22.04", "ubuntu-20.04"]

[releases]
# Sign release assets with this instance's Ed25519 provenance key and publish
# the attestation next to the asset. Opt-in: the key itself is created on first
# start regardless (see [auth] above), this only decides whether uploads get
# signed. Also settable as FORGEKEEP_ATTESTATION_ENABLED=1, which wins.
attestation_enabled = false

[rate_limit]
max = 0          # 0 = disabled (global per-IP limit for every request)
window_secs = 60
# Only these proxy source IPs may supply X-Forwarded-For / X-Real-IP for rate limiting.
# Leave empty when ForgeKeep is directly exposed.
trusted_proxies = []
# trusted_proxies = ["127.0.0.1", "::1", "10.0.0.10"]
# Hard cap on the number of distinct client IPs tracked at once. Bounds memory
# under a distinct-IP flood: once full, a previously-unseen IP is rejected (429)
# instead of growing the map without limit. 0 = built-in default (100000).
max_keys = 0
# Stricter limit applied ONLY to the credential endpoints (/users/register and
# /users/login), independent of `max` above. Always on by default so
# registration spam and password guessing are throttled even when `max = 0`.
# Set auth_max = 0 to disable it.
auth_max = 10
auth_window_secs = 60

[smtp]
# host = "smtp.example.com"
# port = 587
# user = "noreply@example.com"
# pass = "your-password"
# from = "ForgeKeep <noreply@example.com>"

[tls]
# cert = "/path/to/cert.pem"
# key = "/path/to/key.pem"
# The certificate is public; the key is the whole of this server's TLS
# identity, so startup refuses it with any group or world permission bit set
# (`chmod 600`), exactly like this config file and [auth].key_file.

[logging]
# file = "/var/log/forgekeep/forgekeep.log"
max_size_mb = 10
max_files = 5

[audit]
enabled = true
# Where archived audit logs (compressed NDJSON) are written before the rows are
# purged from the database. The server creates this directory and proves it is
# writable at startup — it refuses to start otherwise, since a directory it
# cannot write means the audit log is never trimmed and nothing says so until
# the disk fills. Set `enabled = false` if you do not want archival at all.
# Left unset it defaults to a sibling of `[server].repo_root` when that is an
# absolute path (`/data/repos` → `/data/audit-archive`), so the archive lands on
# the same volume as the rest of the state; otherwise `./data/audit-archive`.
archive_dir = "./data/audit-archive"
archive_after_days = 90
interval_minutes = 60
batch_size = 1000

[backup]
# In-process scheduled backups of the SQLite database (`VACUUM INTO`, safe to
# take while the server is running). With this on, "are there backups?" is
# answered by this file rather than by whether someone remembered to add a cron
# entry on one particular host — and the snapshot is taken from the same pool
# the server uses, so it cannot end up addressing a different database the way
# `forgekeep backup-db` without `--config`/`--db-url` does.
#
# Defaults to false in code so an upgrade never starts consuming
# keep_last x database-size of disk unannounced; it is on here because a fresh
# install should be backed up from the first start.
enabled = true
# The server creates this directory and proves it is writable at startup — it
# refuses to start otherwise, rather than discovering a day later that it cannot
# write backups. Left unset it defaults to a sibling of `[server].repo_root` when
# that is an absolute path (`/data/repos` → `/data/backups`), so snapshots land
# on the same volume as the rest of the state; otherwise `./data/backups`.
dir = "./data/backups"
# Hours between snapshots. The first snapshot after a start is due from the
# newest file already in `dir`, not from the boot: a server restarted more often
# than this still gets backed up, and a crash-looping one does not rotate the
# good snapshots out.
interval_hours = 24
# How many snapshots to keep. The N+1-th evicts the oldest. Only files this
# scheduler wrote (`forgekeep-<timestamp>-<uuid>.db`) are ever deleted — a
# hand-made backup left in the same directory is not touched.
keep_last = 7
#
# NOT covered by this: repositories under `[server].repo_root`. A database
# backup restores users, issues, PRs and settings; the git data is a separate
# artifact. Either snapshot the whole data volume (rsync / filesystem snapshot),
# or decide explicitly that bare repos are recoverable from developer clones —
# but decide, rather than assume this section covers it.
#
# Only the SQLite backend can be snapshotted this way. On PostgreSQL/MySQL,
# `enabled = true` fails the start by design (an instance that looks backed up
# and is not is the failure worth being loud about) — schedule pg_dump /
# mysqldump instead and leave this off.

[imports]
# Import source URLs are user-controlled and normally may not resolve to a
# private, loopback, or link-local address. To import from an internal GitLab
# or GitHub Enterprise Server, an administrator must opt in its exact HTTP(S)
# origin here. Each value is scheme + host + optional port only: paths,
# wildcards, userinfo, query strings, and fragments make startup fail.
#
# One origin covers both the repository clone path and that instance's API
# path. It does NOT trust another port, host, scheme, or a redirect there.
trusted_origins = []
# trusted_origins = ["https://gitlab.internal.example:8443"]
# A private-origin exception above does NOT permit plaintext credentials. If a
# legacy self-hosted source genuinely has no TLS endpoint, name its exact HTTP
# origin again here as a separate acknowledgement of that exposure.
allow_insecure_http_origins = []
# Example exact origins: ["http://gitlab.internal.example:8080"]

[mirror]
# The background schedule that refreshes repository mirrors. A mirror is
# configured per repository (Settings → Mirror) with its own interval; this
# section is only about the sweep that acts on those intervals.
#
# Defaults to true in code, unlike [backup]: a mirror only exists because an
# operator asked for one, and its settings page shows a next-sync time. Turning
# this off is the honest way to say "mirrors are refreshed by hand here" — it
# also stops the server making outbound git calls to operator-supplied remotes
# on a timer, which is the reason to decide it in this file rather than per
# repository.
enabled = true
# HTTPS is the default confidentiality boundary for mirror credentials and
# fetched repository content. Set this only for an operator-controlled
# development network where TLS termination is deliberately unavailable. The
# independent private/loopback/link-local SSRF checks remain enforced. This is
# HTTP-only: native git:// is unencrypted and remains disabled even when true;
# legacy git:// mirror rows fail closed until repointed to HTTPS.
allow_insecure_http = false
# How often the server looks for mirrors whose next sync is due. This is polling
# granularity, not a mirror's schedule — a pass only touches mirrors that are
# already due, so lowering it does not sync anything more often than its own
# interval says.
poll_interval_secs = 60
# Upper bound on mirrors refreshed in one pass. A pass is sequential and every
# mirror means a git subprocess against a third-party remote, so this is what
# keeps a hundred simultaneously-due mirrors from turning one tick into an hour
# of back-to-back fetches. Whatever is left over is still due on the next pass.
batch_size = 10

[timeouts]
# Every value is in seconds. These are the bounds that keep one hung job, one
# stuck `git` subprocess or one exhausted database pool from holding server
# resources indefinitely — leave them commented to get the defaults shown.
#
# CI job wall-clock budget. A job still running after this is failed.
# job_secs = 3600
# Metadata `git` commands (rev-parse, cat-file, log, ...). Short on purpose:
# these are expected to answer immediately.
# git_cmd_secs = 120
# The streaming git transport — upload-pack (clone/fetch) and receive-pack
# (push). More generous than git_cmd_secs because generating a pack for a large
# repository is legitimately slow. 0 disables the bound.
# git_stream_secs = 300
# Idle watchdog layered on top of git_stream_secs: the stream is killed when it
# makes no read/write progress for this long, which is what catches a slow-drip
# push that would otherwise stay under the wall-clock budget. 0 disables it.
# git_idle_secs = 30
# Database pool: how long to wait for a connection, and how long an idle one is
# kept before it is closed.
# db_connect_secs = 10
# db_idle_secs = 600

[observability]
# OpenTelemetry distributed tracing (OTLP/HTTP export). Prometheus metrics at
# /metrics are always on and independent of this section — these knobs only add
# *traces*. Leave otlp_endpoint unset to keep tracing off (zero overhead).
#
# OTLP/HTTP endpoint of your collector. The "/v1/traces" path is appended
# automatically, so the base URL is enough. Overridden by the standard
# OTEL_EXPORTER_OTLP_ENDPOINT / OTEL_EXPORTER_OTLP_TRACES_ENDPOINT env vars.
# otlp_endpoint = "http://localhost:4318"
# service.name resource attribute reported to the collector (default "forgekeep").
# Overridden by OTEL_SERVICE_NAME.
# service_name = "forgekeep"
# Head sampling ratio in 0.0..=1.0 (default 1.0 = record every trace). Lower it
# on a busy instance to reduce export volume, e.g. 0.1 = sample 10%.
# sample_ratio = 1.0
