name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_IMAGE: ghcr.io/nettechnologys/plombir-git

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      commit: ${{ steps.tag.outputs.commit }}
      subcommands: ${{ steps.pages.outputs.subcommands }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check tag, package versions, and release notes
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          version="${tag#v}"
          commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          test "$commit" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$commit" refs/remotes/origin/main
          test -f "docs/releases/${tag}.md"
          python3 - "$version" <<'PY'
          import pathlib, sys, tomllib
          version = sys.argv[1]
          root = pathlib.Path('Cargo.toml')
          assert tomllib.loads(root.read_text())['workspace']['package']['version'] == version
          for manifest in pathlib.Path('crates').glob('*/Cargo.toml'):
              package = tomllib.loads(manifest.read_text())['package']
              assert package['version']['workspace'] is True, manifest
          PY
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # The subcommands README.md and deploy/README.md tell an operator to type,
      # checked against the clap declarations of this commit here, and against
      # the binaries this release ships in the build job. main's guide once
      # named `create-admin` while the latest release had no such command
      # (card_d670212c28bb); a release is held to its own pages instead.
      - name: Subcommands the operator pages name
        id: pages
        shell: bash
        run: |
          set -euo pipefail
          subcommands="$(node scripts/operator-page-subcommands-contract-check.mjs | tr ' ' ':' | paste -sd ' ' -)"
          test -n "$subcommands"
          echo "subcommands=$subcommands" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, attest, and push architecture image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          build-args: |
            PLOMBIR_GIT_SOURCE_COMMIT=${{ needs.validate.outputs.commit }}
            PLOMBIR_GIT_VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Extract and verify release binaries
        shell: bash
        env:
          SUBCOMMANDS: ${{ needs.validate.outputs.subcommands }}
        run: |
          set -euo pipefail
          image="${REGISTRY_IMAGE}:${GITHUB_REF_NAME}-${{ matrix.arch }}"
          docker pull "$image"
          container="$(docker create "$image")"
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p "dist/plombir-git-linux-${{ matrix.arch }}"
          for binary in plombir-git plombir-git-runner plombir-git-mcp; do
            docker cp "$container:/usr/local/bin/$binary" "dist/plombir-git-linux-${{ matrix.arch }}/$binary"
            test -s "dist/plombir-git-linux-${{ matrix.arch }}/$binary"
          done
          mkdir -p "dist/plombir-git-linux-${{ matrix.arch }}/web"
          docker cp "$container:/app/web/build" "dist/plombir-git-linux-${{ matrix.arch }}/web/build"
          test -s "dist/plombir-git-linux-${{ matrix.arch }}/web/build/index.html"
          cp LICENSE NOTICE "dist/plombir-git-linux-${{ matrix.arch }}/"
          test "$(docker run --rm --entrypoint plombir-git "$image" --version)" = "plombir-git ${GITHUB_REF_NAME}"
          test "$(docker run --rm --entrypoint plombir-git-runner "$image" --version)" = "plombir-git-runner ${GITHUB_REF_NAME}"
          test "$(docker run --rm --entrypoint plombir-git-mcp "$image" --version)" = "plombir-git-mcp ${GITHUB_REF_NAME}"
          # Every subcommand this tag's README.md and deploy/README.md name has to
          # answer `--help` in the image being published.
          for invocation in $SUBCOMMANDS; do
            binary="${invocation%%:*}"
            subcommand="${invocation#*:}"
            if ! docker run --rm --entrypoint "$binary" "$image" "$subcommand" --help >/dev/null; then
              echo "::error::The operator pages tell people to run \`$binary $subcommand\`, and the image built from this tag has no such command."
              exit 1
            fi
          done
          tar -C dist -czf "dist/plombir-git-linux-${{ matrix.arch }}.tar.gz" "plombir-git-linux-${{ matrix.arch }}"
          rm -r "dist/plombir-git-linux-${{ matrix.arch }}"
      - name: Export SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY_IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}
          format: spdx-json
          syft-version: v1.54.1
          output-file: dist/plombir-git-linux-${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest binary archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/plombir-git-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.spdx.json
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p dist
      - name: Export source dependency SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          syft-version: v1.54.1
          output-file: dist/plombir-git-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture image
        id: digest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}" \
            --tag "${REGISTRY_IMAGE}:latest" \
            "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}-amd64" \
            "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}-arm64"
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}" --raw \
            | jq -e '[.manifests[].platform.architecture] | index("amd64") and index("arm64")'
          digest="$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}" | awk '$1 == "Digest:" && !found {print $2; found=1}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Verify anonymous image access
        shell: bash
        run: |
          docker logout ghcr.io
          if ! docker buildx imagetools inspect "${REGISTRY_IMAGE}:${GITHUB_REF_NAME}" >/dev/null; then
            echo '::error::GHCR image is not public. A package admin must change its visibility to public, then rerun this job; see docs/releases/README.md.'
            exit 1
          fi
      # The deploy files of this tag, with the compose file's image set to the
      # digest just published: an operator installing this release takes the
      # compose file, the config template and the env example from one commit.
      # A template from main can carry keys this binary refuses at startup, and
      # main's compose points at whichever release Dependabot last proposed
      # (card_57527e3efac9).
      - name: Bundle the deploy files with the published digest
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="plombir-git-deploy-${GITHUB_REF_NAME}"
          image="${REGISTRY_IMAGE}:${GITHUB_REF_NAME}@${DIGEST}"
          compose=deploy/docker-compose.release.yml
          test "$(grep -cE "^    image: ${REGISTRY_IMAGE}[:@]" "$compose")" = 1
          mkdir -p "dist/${bundle}"
          sed -E "s|^(    image: )${REGISTRY_IMAGE}[:@].*$|\1${image}|" "$compose" > "dist/${bundle}/docker-compose.release.yml"
          grep -qxF "    image: ${image}" "dist/${bundle}/docker-compose.release.yml"
          install -m 600 deploy/plombir-git.docker.toml "dist/${bundle}/plombir-git.docker.toml"
          install -m 600 deploy/.env.example "dist/${bundle}/.env.example"
          cp deploy/README.md deploy/nginx.conf.example deploy/Caddyfile.example "dist/${bundle}/"
          (cd "dist/${bundle}" && PLOMBIR_GIT_UID=1000 PLOMBIR_GIT_GID=1000 PLOMBIR_GIT_DEPLOY_ENV_FILE=.env.example \
            docker compose -f docker-compose.release.yml config --quiet)
          tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"
          rm -r "dist/${bundle}"
      - name: Publish release assets and notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -- ./*.tar.gz ./*.spdx.json > SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Plombir Git $GITHUB_REF_NAME" \
              --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
              --verify-tag
          fi
