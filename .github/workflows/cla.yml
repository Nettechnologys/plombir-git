name: CLA

# Plombir Git is AGPL-3.0-or-later and is also sold under a commercial license
# (NOTICE). The second license is only ours to sell for code we hold the rights
# to, and a contribution arrives under the AGPL alone unless its author grants
# more — GitHub's terms default inbound to the repository's license and nothing
# beyond it. CONTRIBUTING.md and CLA.md have promised a signed CLA on every
# first pull request since the repository opened, but nothing collected one, and
# ten commits by two outside authors reached main without it.
#
# This records the signature. Each author of a pull request's commits who has
# not signed yet is asked to comment the sentence from CLA.md § 6; the check
# stays red until every one of them has, and the signature lands as a commit on
# the `cla-signatures` branch, outside the history the ruleset on main guards.
#
# `pull_request_target` runs this file as main has it, with a token that can
# write, so the job must never check out or execute anything from the pull
# request — it only reads authors and comments through the API. `issue_comment`
# is how a signature comment re-runs the check.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize, reopened]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    # A comment on an issue is not a pull request; a comment that is neither the
    # signature nor `recheck` has nothing to say to this check.
    if: >-
      github.event_name == 'pull_request_target'
      || (github.event.issue.pull_request
          && (github.event.comment.body == 'recheck'
              || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-24.04
    permissions:
      # Re-runs the failed check of the pull request once its authors sign.
      actions: write
      # Commits each signature to the `cla-signatures` branch.
      contents: write
      # Comments on the pull request and locks it after the merge, so a
      # signature comment cannot be deleted later.
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The Maintainer's owners and the bots that open dependency updates;
          # none of them contributes work under someone else's copyright.
          allowlist: Yahook,vadiksext,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Plombir Git is also offered under a
            commercial license, so before it can be merged every author of its
            commits signs our [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            once. You keep the copyright in your work. To sign, comment exactly
            the sentence below.
          custom-allsigned-prcomment: All authors of this pull request have signed the CLA.
          signed-commit-message: "$contributorName signed the CLA in $owner/$repo"
