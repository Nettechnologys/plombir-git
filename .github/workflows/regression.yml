name: Regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: "0"

jobs:
  # Formatting is a ratchet, not a preference: before this gate existed the
  # workspace drifted to 51 non-rustfmt-clean files, and the working rule became
  # "never run `cargo fmt --all`" because one command would drag dozens of
  # unrelated files into your diff. The drift came from our own recent edits
  # (23% of the files touched on 2026-07-27 were unformatted, against 1.7% of
  # the ones untouched since the fork import), so it regrows within days unless
  # something checks it. Deliberately its own job: it needs no build, finishes
  # in seconds, and must report independently of whether the test job is red.
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  rust:
    name: Rust tests and migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev git

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Prebuilt binary — no from-source compile, keeps the gate fast.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # nextest runs test binaries in parallel with each other; `cargo test`
      # runs the workspace's 63 test binaries one after another, which on a
      # multi-core runner leaves most of the machine idle. Measured locally on
      # a warm target: 135s -> 27s for the same 628 tests.
      #
      # No `--nocapture`: nextest captures per test and prints the captured
      # output of failing tests, which is what --nocapture was there for. Its
      # nextest spelling (--no-capture) would additionally force the run back
      # to a single thread.
      #
      # There is deliberately no separate `cargo check --workspace --tests` or
      # `cargo test -p rg-http` step ahead of this one: the first compiles
      # everything a second time for no extra signal, and the second re-ran
      # rg-http's 42 integration binaries that `--workspace` already covers.
      - name: Run workspace tests
        run: cargo nextest run --workspace

      # nextest does not run doc-tests (upstream limitation), so they need
      # their own step or they silently stop being checked.
      - name: Run doc-tests
        run: cargo test --workspace --doc

      - name: Fresh DB migration smoke
        run: |
          db_path="${RUNNER_TEMP}/forgekeep-ci-migration.db"
          cargo run -p rg-cli -- migrate --db-url "sqlite://${db_path}?mode=rwc"

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Prebuilt binaries — no from-source compile, keeps the gate fast.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      # RustSec advisory scan. Accepted-with-no-fix advisories are pinned in
      # .cargo/audit.toml; a NEW vulnerability fails the job.
      - name: cargo audit
        run: cargo audit

      # advisories + licenses (permissive-only) + bans + crate sources.
      # Config and the shared advisory ignore-list live in deny.toml.
      - name: cargo deny
        run: cargo deny check

      # OSV/GHSA advisory scan — closes the RustSec-vs-OSV source-coverage gap.
      # cargo-audit/deny only see the RustSec DB; some advisories are GHSA/OSV-only
      # (e.g. jsonwebtoken CVE-2026-25537 / GHSA-h395-gr6q-cpjc, openssl 0.10.x
      # memory-safety fixes) and slip past the RustSec gate entirely. This step
      # runs osv-scanner against Cargo.lock so those surface in CI.
      #
      # Informational for now (continue-on-error): the live OSV DB may flag
      # OSV-only advisories across the transitive tree that haven't been triaged
      # yet, and a hard fail would block unrelated PRs. Once the full OSV finding
      # set is triaged (ignore-list where justified, no-fix documented), drop
      # continue-on-error to promote this to a blocking gate.
      - name: Install osv-scanner
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: osv-scanner

      - name: osv-scanner (OSV/GHSA advisories, informational)
        continue-on-error: true
        run: |
          osv-scanner scan --lockfile=Cargo.lock \
            || osv-scanner --lockfile=Cargo.lock

  git-protocol:
    name: Real Git client protocol matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev git openssh-client curl python3

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build ForgeKeep
        run: cargo build -p rg-cli

      - name: Run HTTP and SSH protocol matrix
        env:
          FORGEKEEP_BIN: ${{ github.workspace }}/target/debug/forgekeep
        run: scripts/git-protocol-e2e.sh

  postgres-smoke:
    name: PostgreSQL migration, CRUD and FTS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forgekeep
          POSTGRES_PASSWORD: forgekeep
          POSTGRES_DB: forgekeep
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgekeep -d forgekeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FORGEKEEP_TEST_DATABASE_URL: postgres://forgekeep:forgekeep@127.0.0.1:5432/forgekeep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run PostgreSQL runtime smoke
        run: cargo test -p rg-core --test multi_backend_smoke -- --ignored --nocapture

  mysql-smoke:
    name: MySQL migration, CRUD and FTS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: forgekeep
          MYSQL_USER: forgekeep
          MYSQL_PASSWORD: forgekeep
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uforgekeep -pforgekeep"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      FORGEKEEP_TEST_DATABASE_URL: mysql://forgekeep:forgekeep@127.0.0.1:3306/forgekeep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run MySQL runtime smoke
        run: cargo test -p rg-core --test multi_backend_smoke -- --ignored --nocapture

  contract-checks:
    name: Frontend/backend contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # scripts/frontend-href-contract-check.mjs enumerates web/src through
      # ripgrep. It ships with the current ubuntu-latest image, but that is an
      # image detail rather than a contract — install it so the gate cannot go
      # red because a runner image dropped a package.
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      # The 33 contract checks are pure Node reading repository sources: no npm
      # install, no build, no running backend. The whole set takes ~1s, so it is
      # the cheapest gate in this workflow and deliberately has no dependencies
      # on the other jobs.
      #
      # The runner globs scripts/*-contract-check.mjs rather than listing them,
      # so a check added in a PR gates that same PR. Checks that are red for a
      # tracked reason are quarantined inside the runner and reported without
      # failing the job; see its header for the ratchet rules.
      - name: Run contract checks
        run: node scripts/run-contract-checks.mjs

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: Build frontend
        run: npm run build

  deploy-config:
    name: Docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate main compose
        run: |
          cp deploy/.env.example deploy/.env
          secret="$(openssl rand -hex 32)"
          sed -i "s/^FORGEKEEP_JWT_SECRET=.*/FORGEKEEP_JWT_SECRET=${secret}/" deploy/.env
          docker compose -f deploy/docker-compose.yml config >/tmp/forgekeep-compose-main.yml
          rm -f deploy/.env

      - name: Validate observability compose
        run: docker compose -f deploy/docker-compose.observability.yml config >/tmp/forgekeep-compose-observability.yml
