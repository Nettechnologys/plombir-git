name: Regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  # Formatting is a ratchet, not a preference: before this gate existed the
  # workspace drifted to 51 non-rustfmt-clean files, and the working rule became
  # "never run `cargo fmt --all`" because one command would drag dozens of
  # unrelated files into your diff. The drift came from our own recent edits
  # (23% of the files touched on 2026-07-27 were unformatted, against 1.7% of
  # the ones untouched since the fork import), so it regrows within days unless
  # something checks it. Deliberately its own job: it needs no build, finishes
  # in seconds, and must report independently of whether the test job is red.
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every job installs the toolchain `rust-toolchain.toml` names, with the
      # components it lists, rather than whatever `stable` is on the day of the
      # run. That file is also what the local push-gate verifier and the Docker
      # image build with, so a green receipt and a green job prove the same
      # thing. rustup is preinstalled on the hosted runners.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Check formatting
        run: cargo fmt --all -- --check

  # The workspace is configured to make clippy fail, not merely warn: the
  # `[workspace.lints.clippy]` block in Cargo.toml raises await_holding_lock /
  # await_holding_refcell_ref / let_underscore_must_use to `deny`, and every
  # crate opts in via `[lints] workspace = true`. Until this job existed nothing
  # ever ran `cargo clippy`, so those denies were a declaration rather than a
  # gate — a non-async lock guard held across an `.await` (CWE-833: blocked
  # tokio worker, deadlock/DoS) could land on main and no check would notice.
  #
  # Its own job for the same reason as Rustfmt: a lint result must report
  # independently of whether the test job is red, and a clippy failure ahead of
  # the tests inside one job would mean no test feedback at all on that run.
  #
  # Warning-free is the delivery contract, so CI and the receipt-producing local
  # verifier use the same strict command on the same toolchain
  # (`rust-toolchain.toml`). Lints a newer toolchain brings are triaged in the
  # commit that bumps it, instead of turning main red on the day a new stable
  # ships.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev git

      # The minimal profile ships neither clippy nor rustfmt;
      # `rust-toolchain.toml` requests both by name.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # --all-targets so tests, examples and benches are linted too: the deny
      # lints are about code that runs, and test code holding a guard across an
      # await hangs the suite exactly the same way.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -j 6 -- -D warnings

  # `[workspace.lints.rustdoc]` denies `broken_intra_doc_links`, and until this
  # job existed nothing in the repository ran rustdoc — so that deny was a
  # declaration, exactly as the clippy denies above were before their job. The
  # cost of the gap was measurable: 12 doc links across five crates pointed at
  # symbols that no longer exist, one of them (`require_blob_digest` in the OCI
  # blob path) on a security boundary a reviewer followed and lost time on.
  #
  # `--no-deps` because the subject is this workspace's own prose; documenting
  # the dependency graph would multiply the build for nothing this gate reads.
  # Its own job for the same reason as Rustfmt and Clippy: a documentation
  # failure must report independently of whether the tests are red.
  docs:
    name: Rustdoc intra-doc links
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev git

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the workspace documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps -j 6

  # `rust-version` in Cargo.toml is a promise to downstream builders, and an
  # unchecked one drifted: it said 1.85 while the lockfile needed 1.88.
  # This job builds the workspace with exactly the declared
  # toolchain against the committed lockfile, reading the number from the one
  # place it is declared.
  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev git

      - name: Read the declared MSRV
        id: msrv
        run: node scripts/msrv-declaration-contract-check.mjs --print >>"${GITHUB_OUTPUT}"

      - name: Install the MSRV toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: rustup toolchain install "${MSRV}" --profile minimal --no-self-update

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv

      - name: Check the workspace with the MSRV toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: cargo "+${MSRV}" check --workspace --locked -j 6

  rust:
    name: Rust tests and migration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev git git-lfs

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Prebuilt binary — no from-source compile, keeps the gate fast.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-nextest

      # nextest runs test binaries in parallel with each other; `cargo test`
      # runs the workspace's 63 test binaries one after another, which on a
      # multi-core runner leaves most of the machine idle. Measured locally on
      # a warm target: 135s -> 27s for the same 628 tests.
      #
      # No `--nocapture`: nextest captures per test and prints the captured
      # output of failing tests, which is what --nocapture was there for. Its
      # nextest spelling (--no-capture) would additionally force the run back
      # to a single thread.
      #
      # There is deliberately no separate `cargo check --workspace --tests` or
      # `cargo test -p rg-http` step ahead of this one: the first compiles
      # everything a second time for no extra signal, and the second re-ran
      # rg-http's 42 integration binaries that `--workspace` already covers.
      - name: Run workspace tests
        run: cargo nextest run --workspace

      # The stock clients against the registry and the LFS API: `docker` and
      # `git lfs`, not our idea of what they send. `#[ignore]`d because a
      # developer machine may lack either; this runner has both, and until this
      # step nothing ran them anywhere (card_7404df85da21).
      - name: Run stock Docker and Git LFS client tests
        run: >-
          cargo nextest run -p rg-http --test integration --run-ignored only
          -E 'test(/^oci_live_client_tests::/) | test(/^lfs_locks_stock_client_tests::/)
          | test(old_url_clone_with_lfs_checks_out_the_file_content)'

      # The step model's container half against a real daemon: one container
      # per job, `docker exec` per step, and a timed-out step killed together
      # with what it started while the container lives on for the next one
      # (card_c8b3fa9f0ebc). `#[ignore]`d for the reason above. With it, the
      # job's `services:`: a step reaches a healthy postgres by its key, and a
      # cancelled job leaves no service and no network (card_bc6676ec0ae3).
      # And the sweep after a killed runner: its steps container and a network
      # its containers no longer hold go, a live runner's stay
      # (card_1bc3247315ff). And the job's own write to its workspace, with the
      # container user chosen from the daemon — rootful or rootless
      # (card_b6c6944d94cd).
      - name: Run step-model container test
        run: >-
          cargo nextest run -p rg-process --run-ignored only
          -E 'test(ci_steps::tests::steps_share_one_container_and_a_timeout_spares_it)
          | test(ci_steps::tests::a_container_job_writes_to_its_workspace_on_any_daemon)
          | test(/^ci_steps::services_docker_tests::/)
          | test(ci_services::tests::the_sweep_removes_a_dead_runners_container_and_network_on_a_real_daemon)'

      # The real `actions/setup-node` and `actions/setup-go`, pinned by commit,
      # fetched from github.com, packed and run with Node by the step runner
      # (card_a1290adf28fd). `#[ignore]`d: it needs the network and Node.js,
      # which this job has and a developer's offline `cargo test` may not.
      - name: Run JavaScript actions test
        run: >-
          cargo nextest run -p rg-ci --run-ignored only
          -E 'test(javascript_action_tests::setup_node_and_setup_go_run_from_their_pinned_commits)'

      # The same client over an SSH remote, with no HTTP server at all:
      # `git-lfs-transfer` carries the objects and the locks, and the test
      # counts the SSH connections a push opens (card_f11136311b12).
      - name: Run stock Git LFS over SSH client test
        run: >-
          cargo nextest run -p rg-ssh --test integration --run-ignored only
          -E 'test(/^ssh_lfs_transfer_stock_client_tests::/)'

      # An import from a real Gitea and a real Forgejo, each started and filled
      # through its own API by the script. Recorded samples could not have
      # caught what the first live run did — Gitea's `base.sha` is the branch
      # tip at request time, so a merged pull request's diff came out empty —
      # and a new release can change a shape the same way (card_7f2bdd581d17).
      # Both images are pinned in .github/ci-images/Dockerfile, so the next
      # release reaches this step as a Dependabot pull request.
      - name: Run live Gitea and Forgejo import tests
        run: |
          for server in gitea forgejo; do
            echo "::group::${server}"
            eval "$(bash scripts/gitea-import-live.sh up "${server}")"
            cargo nextest run -p rg-core --test integration --run-ignored only -E 'test(=import_gitea_live_tests::a_gitea_repository_imports_with_its_history)'
            bash scripts/gitea-import-live.sh down
            echo "::endgroup::"
          done

      # nextest does not run doc-tests (upstream limitation), so they need
      # their own step or they silently stop being checked.
      - name: Run doc-tests
        run: cargo test --workspace --doc

      - name: Fresh DB migration smoke
        run: |
          db_path="${RUNNER_TEMP}/plombir-git-ci-migration.db"
          cargo run -p rg-cli -- migrate --db-url "sqlite://${db_path}?mode=rwc"

  security-audit:
    name: Dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      # Prebuilt binaries — no from-source compile, keeps the gate fast.
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-audit,cargo-deny

      # RustSec advisory scan. Accepted-with-no-fix advisories are pinned in
      # .cargo/audit.toml; a NEW vulnerability fails the job.
      - name: cargo audit
        run: cargo audit

      # advisories + licenses (permissive-only) + bans + crate sources.
      # Config and the shared advisory ignore-list live in deny.toml.
      - name: cargo deny
        run: cargo deny check

      # OSV/GHSA advisory scan — closes the RustSec-vs-OSV source-coverage gap.
      # cargo-audit/deny only see the RustSec DB; some advisories are GHSA/OSV-only
      # (e.g. jsonwebtoken CVE-2026-25537 / GHSA-h395-gr6q-cpjc, openssl 0.10.x
      # memory-safety fixes) and slip past the RustSec gate entirely. This step
      # runs osv-scanner against Cargo.lock so those fail the job too.
      #
      # It was informational (continue-on-error) for weeks and printed eight
      # GHSA advisories against the public SSH server's russh 0.60.3 — a
      # pre-auth panic among them — without stopping anything
      # (card_95a9eb65f6d4). Accepted advisories live in osv-scanner.toml, which
      # scripts/advisory-ignore-list-contract-check.mjs keeps equal to
      # .cargo/audit.toml and deny.toml; everything else is red.
      - name: Install osv-scanner
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: osv-scanner

      - name: osv-scanner (OSV/GHSA advisories)
        run: osv-scanner scan --config=osv-scanner.toml --lockfile=Cargo.lock

      # The frontend's npm tree gets the same treatment as Cargo.lock. Nothing
      # else watches it: dependabot.yml has no npm ecosystem and the
      # repository's Dependabot alerts are off, so six high advisories in
      # web/package-lock.json once sat there until a manual clean-up
      # (card_d31056dd93b1). `npm audit` reads the lockfile alone, no install.
      #
      # The whole tree, dev dependencies included: vite, vitest and svelte-check
      # run on every contributor's machine and in this workflow. High and
      # critical fail the job; low and moderate are printed and do not. The
      # remedy for a transitive advisory is an `overrides` entry in
      # web/package.json that pins the fixed version — npm has no ignore-list,
      # and accepting an unfixed advisory is a decision, not a config line.
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: npm audit (web/package-lock.json)
        working-directory: web
        run: npm audit --audit-level=high

  git-protocol:
    name: Real Git client protocol matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev git openssh-client curl python3

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build Plombir Git
        run: cargo build -p rg-cli

      - name: Run HTTP and SSH protocol matrix
        env:
          PLOMBIR_GIT_BIN: ${{ github.workspace }}/target/debug/plombir-git
        run: scripts/git-protocol-e2e.sh

  # The only check that an outsider is turned away at the *button*, not just at
  # the route: two real accounts drive every write control of the UI in a
  # headless Chrome against a throwaway server. It used to run nowhere, and
  # rotted where nobody saw it — a fixture wrote to a branch its own setup had
  # just protected.
  ui-access-sweep:
    name: Browser UI access sweep
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libsqlite3-dev git curl

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build Plombir Git
        run: cargo build -p rg-cli

      # ubuntu-latest carries Google Chrome at the path the runner defaults to.
      - name: Run the browser sweep
        env:
          PLOMBIR_GIT_BIN: ${{ github.workspace }}/target/debug/plombir-git
          CHROME: /usr/bin/google-chrome
        run: scripts/ui-access-sweep-e2e.sh

  postgres-smoke:
    name: PostgreSQL migration, CRUD and FTS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # PostgreSQL 17.11. Pinned by the multi-platform index digest so a rerun
        # of the same commit migrates against the same server build. The pin
        # lives in .github/ci-images/Dockerfile, where Dependabot sees it; a
        # service image cannot be read from a file, so it is repeated here and
        # scripts/ci-image-pins-contract-check.mjs fails while the two differ.
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: plombir_git
          POSTGRES_PASSWORD: plombir_git
          POSTGRES_DB: plombir_git
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plombir_git -d plombir_git"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PLOMBIR_GIT_TEST_DATABASE_URL: postgres://plombir_git:plombir_git@127.0.0.1:5432/plombir_git
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # First, deliberately: this reproduces the original failure only while the
      # database is still empty, because that is when concurrent migrators race
      # inside `CREATE TABLE`. Every step below leaves the schema applied, after
      # which the same test can only prove that the lock path does not break a
      # no-op run.
      - name: Prove concurrent PostgreSQL migrators are serialized
        run: "cargo test -p rg-db -j 6 --test integration server_migration_serialization:: -- --ignored --nocapture"

      # The claim that the migration lock removed the need for `--test-threads=1`
      # on a server backend: this file's tests migrate the same database in
      # parallel, which is exactly what used to collide.
      - name: Prove a parallel rg-db test file migrates PostgreSQL safely
        run: "cargo test -p rg-db -j 6 --test integration password_reset_token_single_use:: -- --nocapture"

      # Single-use and compare-and-swap are claims the *database* arbitrates, so
      # they are claims about each backend. Both files honour
      # PLOMBIR_GIT_TEST_DATABASE_URL for exactly this step.
      # SQLite answers `SUM(integer)` with an INTEGER; this backend does not,
      # and only a non-NULL total exposes the difference.
      - name: Prove integer SUM aggregates decode on PostgreSQL
        run: "cargo test -p rg-db -j 6 --test integration aggregate_sums_decode:: -- --nocapture"

      - name: Prove single-use credentials hold on PostgreSQL
        run: >-
          cargo test -p rg-db -j 6 --test integration -- --nocapture
          mfa_backup_code_single_use::
          passkey_counter_compare_and_swap::
          totp_step_single_use::
          webauthn_ceremony_single_use::

      - name: Prove PostgreSQL code FTS create/retry boundary
        run: cargo test -p rg-db-migration -j 6 server_create_preserves_live_rows_and_recovers_after_every_stage -- --ignored --nocapture

      - name: Prove PostgreSQL CI secret scoping converges and reverses
        run: cargo test -p rg-db-migration -j 6 server_up_converges_after_an_interrupted_run_and_down_reverses_it -- --ignored --nocapture

      - name: Prove PostgreSQL code index refresh boundary
        run: cargo test -p rg-core -j 6 server_code_index_rebuild_publishes_atomically_without_holding_writers -- --ignored --nocapture

      # Server-database tests that no step ran until the ignored-tests gate
      # read this workflow (card_0c68a0dc41e8).
      - name: Prove default-branch and import adoption serialize on PostgreSQL
        run: cargo test -p rg-core -j 6 --lib adoption_and_settings_serialize_on_server_database -- --ignored --nocapture

      - name: Prove hook, secret and provider storage limits on PostgreSQL
        run: >-
          cargo test -p rg-http --test integration -j 6 -- --ignored --nocapture
          ci_secrets_tag_protection_tests::
          organization_deletion_storage_tests::
          sso_provider_storage_limit_tests::
          webhook_lifecycle_storage_tests::
          webhook_secret_at_rest_tests::

      # This one migrates an empty database to the schema just before its
      # migration, so it gets a database of its own beside the shared one.
      - name: Create an exclusive PostgreSQL database
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          createdb -U plombir_git plombir_git_exclusive

      - name: Prove the issue-comment reference installs over orphans on PostgreSQL
        env:
          PLOMBIR_GIT_TEST_EXCLUSIVE_DATABASE_URL: postgres://plombir_git:plombir_git@127.0.0.1:5432/plombir_git_exclusive
        run: cargo test -p rg-db-migration -j 6 --lib the_reference_installs_over_orphans_on_a_server_database -- --ignored --nocapture

      - name: Run PostgreSQL runtime smoke
        run: cargo test -p rg-core --test multi_backend_smoke -j 6 -- --ignored --nocapture

      - name: Prove remote values and repository credential retirement on PostgreSQL
        run: "cargo test -p rg-http --test integration -j 6 remote_storage_lifecycle_tests:: -- --ignored --nocapture"

      # PostgreSQL compares repository names exactly; the folded key is what
      # makes `payments` next to `Payments` a conflict here (card_552648b36416).
      - name: Prove a repository name is taken in any case on PostgreSQL
        run: "cargo test -p rg-http --test integration -j 6 repo_name_case_tests:: -- --ignored --nocapture"

      - name: Prove remote column widening keeps live PostgreSQL rows
        run: cargo test -p rg-db --test integration -j 6 widened_columns_keep_live_rows_and_hold_accepted_values -- --nocapture

      - name: Prove large webhook deliveries remain replayable on PostgreSQL
        run: cargo test -p rg-core -j 6 large_delivery_is_journaled_and_replayable_on_server_database -- --ignored --nocapture

      # Last because the focused migration test replaces only package_files in
      # this disposable database to exercise the pre-migration schema directly.
      - name: Prove package filename uniqueness on PostgreSQL
        env:
          PLOMBIR_GIT_PACKAGE_FILE_MIGRATION_TEST_DATABASE_URL: ${{ env.PLOMBIR_GIT_TEST_DATABASE_URL }}
        run: cargo test -p rg-db-migration -j 6 one_filename_per_version_is_owned_by_the_database -- --nocapture

  mysql-smoke:
    name: MySQL migration, CRUD and FTS smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        # MySQL 8.4.11, pinned by digest for the reason given on postgres-smoke.
        image: mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: plombir_git
          MYSQL_USER: plombir_git
          MYSQL_PASSWORD: plombir_git
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uplombir_git -pplombir_git"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PLOMBIR_GIT_TEST_DATABASE_URL: mysql://plombir_git:plombir_git@127.0.0.1:3306/plombir_git
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Allow the migration account to create triggers with binary logging
        run: >-
          docker exec "${{ job.services.mysql.id }}"
          mysql -uroot -proot
          -e "SET GLOBAL log_bin_trust_function_creators = 1"

      # First test step, for the same reason as in the PostgreSQL job: concurrent
      # migrators only collide while the schema is still absent.
      - name: Prove concurrent MySQL migrators are serialized
        run: "cargo test -p rg-db -j 6 --test integration server_migration_serialization:: -- --ignored --nocapture"

      - name: Prove a parallel rg-db test file migrates MySQL safely
        run: "cargo test -p rg-db -j 6 --test integration password_reset_token_single_use:: -- --nocapture"

      # MySQL is the backend that makes this worth a step of its own: it counts
      # *changed* rows rather than matched ones, so a compare-and-swap that
      # answers from `rows_affected` alone reads a no-op as a lost race here and
      # nowhere else.
      # SQLite answers `SUM(integer)` with an INTEGER; this backend does not,
      # and only a non-NULL total exposes the difference.
      - name: Prove integer SUM aggregates decode on MySQL
        run: "cargo test -p rg-db -j 6 --test integration aggregate_sums_decode:: -- --nocapture"

      - name: Prove single-use credentials hold on MySQL
        run: >-
          cargo test -p rg-db -j 6 --test integration -- --nocapture
          mfa_backup_code_single_use::
          passkey_counter_compare_and_swap::
          totp_step_single_use::
          webauthn_ceremony_single_use::

      - name: Prove MySQL FTS migration maintenance boundary
        run: cargo test -p rg-db-migration -j 6 mysql_fts_maintenance_holds_an_offline_boundary -- --ignored --nocapture

      - name: Prove MySQL code FTS create/retry boundary
        run: cargo test -p rg-db-migration -j 6 server_create_preserves_live_rows_and_recovers_after_every_stage -- --ignored --nocapture

      - name: Prove MySQL CI secret scoping converges and reverses
        run: cargo test -p rg-db-migration -j 6 server_up_converges_after_an_interrupted_run_and_down_reverses_it -- --ignored --nocapture

      - name: Prove MySQL code index refresh boundary
        run: cargo test -p rg-core -j 6 server_code_index_rebuild_publishes_atomically_without_holding_writers -- --ignored --nocapture

      # Server-database tests that no step ran until the ignored-tests gate
      # read this workflow (card_0c68a0dc41e8).
      - name: Prove default-branch and import adoption serialize on MySQL
        run: cargo test -p rg-core -j 6 --lib adoption_and_settings_serialize_on_server_database -- --ignored --nocapture

      - name: Prove hook, secret and provider storage limits on MySQL
        run: >-
          cargo test -p rg-http --test integration -j 6 -- --ignored --nocapture
          ci_secrets_tag_protection_tests::
          organization_deletion_storage_tests::
          sso_provider_storage_limit_tests::
          webhook_lifecycle_storage_tests::
          webhook_secret_at_rest_tests::

      # This one migrates an empty database to the schema just before its
      # migration, so it gets a database of its own beside the shared one.
      - name: Create an exclusive MySQL database
        run: >-
          docker exec "${{ job.services.mysql.id }}"
          mysql -uroot -proot
          -e "CREATE DATABASE plombir_git_exclusive; GRANT ALL ON plombir_git_exclusive.* TO 'plombir_git'@'%'"

      - name: Prove the issue-comment reference installs over orphans on MySQL
        env:
          PLOMBIR_GIT_TEST_EXCLUSIVE_DATABASE_URL: mysql://plombir_git:plombir_git@127.0.0.1:3306/plombir_git_exclusive
        run: cargo test -p rg-db-migration -j 6 --lib the_reference_installs_over_orphans_on_a_server_database -- --ignored --nocapture

      - name: Run MySQL runtime smoke
        run: cargo test -p rg-core --test multi_backend_smoke -j 6 -- --ignored --nocapture

      - name: Prove remote values and repository credential retirement on MySQL
        run: "cargo test -p rg-http --test integration -j 6 remote_storage_lifecycle_tests:: -- --ignored --nocapture"

      # MySQL's default collation hands one repository to several spellings of
      # its address, and only here can a durable key built from the request's
      # spelling show (card_7e82c1b1f642, card_3f1936e7d4a7, card_3b3d49c60ab1).
      - name: Prove storage follows the rows' spelling, and names fold, on MySQL
        run: >-
          cargo test -p rg-http --test integration -j 6 -- --ignored --nocapture
          oci_namespace_spelling_tests::
          repo_rebind_spelling_tests::
          repo_name_case_tests::
          repo_address_spelling_tests::

      - name: Prove remote column widening keeps live MySQL rows
        run: cargo test -p rg-db --test integration -j 6 widened_columns_keep_live_rows_and_hold_accepted_values -- --nocapture

      - name: Prove large webhook deliveries remain replayable on MySQL
        run: cargo test -p rg-core -j 6 large_delivery_is_journaled_and_replayable_on_server_database -- --ignored --nocapture

      # Last for the same reason as PostgreSQL: this is an isolated schema
      # migration proof, not another consumer of the runtime-smoke fixtures.
      - name: Prove package filename uniqueness on MySQL
        env:
          PLOMBIR_GIT_PACKAGE_FILE_MIGRATION_TEST_DATABASE_URL: ${{ env.PLOMBIR_GIT_TEST_DATABASE_URL }}
        run: cargo test -p rg-db-migration -j 6 one_filename_per_version_is_owned_by_the_database -- --nocapture

  contract-checks:
    name: Frontend/backend contract checks
    runs-on: ubuntu-latest
    # A ceiling against a hang, not a budget. The first runs on hosted runners
    # took 8m40s and then more than 10 minutes for the same tree — the old
    # ceiling cancelled a job whose every check was green. Most of the time is
    # the regression stands, not the checks.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # scripts/frontend-href-contract-check.mjs enumerates web/src through
      # ripgrep, and scripts/workflow-yaml-contract-check.mjs parses this file
      # with PyYAML. Both ship with the current ubuntu-latest image, but that is
      # an image detail rather than a contract — install them so the gates cannot
      # go red because a runner image dropped a package. The YAML check refuses
      # to run rather than pass when it finds no parser, so a dropped PyYAML
      # would take the workflow gate down with it.
      - name: Install ripgrep and a YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep python3-yaml

      # The contract checks are pure Node reading repository sources: no npm
      # install, no build, no running backend. The checks themselves take about
      # a minute and a half; the regression stands that prove they still assert
      # something take the rest (see the ceiling above). The job deliberately
      # has no dependencies on the other jobs. (Their count is deliberately not
      # written here — the runner globs them and reports it, and a number in a
      # comment is one more thing that silently stops being true.)
      #
      # The runner globs scripts/*-contract-check.mjs rather than listing them,
      # so a check added in a PR gates that same PR. Checks that are red for a
      # tracked reason are quarantined inside the runner and reported without
      # failing the job; see its header for the ratchet rules.
      - name: Run contract checks
        run: node scripts/run-contract-checks.mjs

  frontend:
    name: Frontend check and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      # Vitest under jsdom. The suite that matters here is the markdown
      # sanitizer (src/lib/utils/markdown.test.ts): it is the boundary between
      # user-supplied markdown (README, issue, comment, wiki) and the DOM, so a
      # regression in it is stored XSS rather than a cosmetic bug.
      #
      # The DOM environment is the point, not a convenience. This step replaced
      # a smoke script that loaded the module in bare Node — where `DOMParser`
      # does not exist — and so asserted a regex fallback no browser ever ran,
      # while the code every browser does run went untested. The fallback is
      # gone and `sanitizeHtml` now throws without a DOM, so a runner that
      # somehow lacks one fails loudly instead of testing something else.
      - name: Unit tests
        run: npm test

      - name: Build frontend
        run: npm run build

  deploy-config:
    name: Docker compose config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Globs deploy/docker-compose*.yml rather than naming the files, for the
      # same reason the contract-check runner does: the two named here used to
      # be all of them, and `docker-compose.hostdir.yml` — the variant this
      # repository recommends for a real deployment, and the one whose bind-mount
      # traps cost a day of debugging — was added later and validated by nobody.
      # A compose file added in a PR now gets checked by that same PR.
      #
      # The empty-glob branch is the ratchet: if the files are renamed or moved,
      # this fails loudly instead of quietly passing a loop over nothing.
      #
      # deploy/.env is created first because hostdir's `env_file` requires it to
      # exist, and the main compose reads PLOMBIR_GIT_JWT_SECRET out of it. It is
      # a throwaway secret for a throwaway runner, but it is still removed after.
      - name: Validate every compose file
        run: |
          set -euo pipefail
          install -m 600 deploy/.env.example deploy/.env
          secret="$(openssl rand -hex 32)"
          sed -i "s/^PLOMBIR_GIT_JWT_SECRET=.*/PLOMBIR_GIT_JWT_SECRET=${secret}/" deploy/.env
          # The observability compose requires a Grafana admin password.
          sed -i "s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)/" deploy/.env
          trap 'rm -f deploy/.env' EXIT

          shopt -s nullglob
          composes=(deploy/docker-compose*.yml)
          if [ "${#composes[@]}" -eq 0 ]; then
            echo "No deploy/docker-compose*.yml found — the glob no longer matches anything." >&2
            exit 1
          fi
          # docker-compose.release.yml refuses to interpolate without the
          # uid/gid it runs the server as — it has no 1000 fallback on purpose.
          PLOMBIR_GIT_UID="$(id -u)"
          PLOMBIR_GIT_GID="$(id -g)"
          export PLOMBIR_GIT_UID PLOMBIR_GIT_GID
          for compose in "${composes[@]}"; do
            echo "Validating ${compose}"
            docker compose -f "${compose}" config >/dev/null
          done

      # The reverse-proxy examples deploy/README.md tells operators to copy,
      # loaded by the proxies themselves (`nginx -t`, `caddy validate`). The
      # same script runs in the local push gates.
      - name: Validate the reverse-proxy examples
        run: bash scripts/check-reverse-proxy-examples.sh

  # The observability stack's configuration is production configuration, and
  # `deploy-config` above does not cover it: `docker compose config` merges and
  # prints compose YAML, and never opens the files compose bind-mounts into the
  # Prometheus, Alertmanager and Grafana containers. So nothing in this workflow
  # read them, and both drifted — the Alertmanager config as committed could not
  # be *loaded at all* (angle-bracket placeholders where `api_url` needs a URL),
  # which means the stack came up with that container in a restart loop.
  #
  # This job is the syntax half of the coverage. The semantic half — a rule
  # grouping by a label the exporter does not emit — is
  # `scripts/observability-contract-check.mjs` in the contract-checks job above,
  # and it has to be separate because to promtool `by (route)` over a histogram
  # with no `route` label is perfectly valid PromQL. Neither half subsumes the
  # other: promtool catches a malformed expression the contract check cannot
  # parse either, the contract check catches the silent drift promtool accepts.
  #
  # Both tools ship inside the official images and nowhere else, so they are run
  # from containers rather than installed — and from the *same image tag* the
  # compose file starts, read out of it rather than written twice. A pinned
  # duplicate here would validate the config with a promtool that is not the one
  # loading it the moment somebody bumps the stack, which is the drift this job
  # exists to catch, one level up. (Pinned, in either spelling: a floating
  # `latest` would turn main red on an unrelated PR, as the clippy job explains.)
  #
  # The globs and their empty branches are the ratchet, same as deploy-config: a
  # second rule file or a renamed directory must fail loudly instead of quietly
  # passing a loop over nothing.
  observability-config:
    name: Prometheus, Alertmanager, and Grafana config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Grafana has no offline provisioning linter. Use the same real YAML
      # parser as the workflow contract gate, installed explicitly so a runner
      # image change cannot turn validation into either a false green or a
      # missing-tool surprise.
      - name: Install YAML parser
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml

      # One read of the compose file, through the same YAML parser installed
      # above, for the two facts this job needs from it: the image tags it runs,
      # and whether every file the stack bind-mounts exists. Both used to be
      # pulled out of the raw bytes by shell here and again in the local mirror
      # — `grep … | head -1` handed the win to a commented-out pin above the
      # live one, and Docker creates a missing mount source as an empty
      # directory rather than failing. The script's header
      # carries the detail; stdout is `GITHUB_OUTPUT` syntax, the log half is on
      # stderr.
      - name: Image pins and mounted files of the observability stack
        id: images
        run: node scripts/observability-compose-contract-check.mjs >>"${GITHUB_OUTPUT}"

      # `check config` resolves `rule_files:` relative to the config file, so the
      # directory is mounted whole and the alert rules get validated here too;
      # `check rules` then covers any rule file the config does not reference.
      - name: Validate Prometheus config and alert rules
        env:
          IMAGE: ${{ steps.images.outputs.prometheus }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          configs=(deploy/prometheus/prometheus*.yml)
          rules=(deploy/prometheus/alerts*.yml)
          if [ "${#configs[@]}" -eq 0 ] || [ "${#rules[@]}" -eq 0 ]; then
            echo "deploy/prometheus/ no longer holds a prometheus*.yml and an alerts*.yml." >&2
            exit 1
          fi

          promtool() {
            docker run --rm -v "${PWD}/deploy/prometheus:/cfg:ro" \
              --entrypoint promtool "${IMAGE}" "$@"
          }
          for config in "${configs[@]}"; do
            promtool check config "/cfg/$(basename "${config}")"
          done
          for rule in "${rules[@]}"; do
            promtool check rules "/cfg/$(basename "${rule}")"
          done

      - name: Validate Alertmanager config
        env:
          IMAGE: ${{ steps.images.outputs.alertmanager }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          configs=(deploy/alertmanager/*.yml)
          if [ "${#configs[@]}" -eq 0 ]; then
            echo "deploy/alertmanager/ no longer holds a *.yml." >&2
            exit 1
          fi
          for config in "${configs[@]}"; do
            docker run --rm -v "${PWD}/deploy/alertmanager:/cfg:ro" \
              --entrypoint amtool "${IMAGE}" \
              check-config "/cfg/$(basename "${config}")"
          done

      - name: Validate Grafana provisioning YAML and mount contract
        run: node scripts/grafana-provisioning-contract-check.mjs

      # Grafana has no offline linter, and a parse proves nothing about what it
      # will do with a dashboard: moving to Grafana 13 left every Angular
      # `graph` panel as "Panel plugin not found", which Grafana provisions
      # without a log line and `JSON.parse` accepts. So the pinned image itself
      # is booted with this provisioning and asked which panel and data source
      # plugins it has; every panel type and data source reference must resolve
      # against that answer. The `[$route]` range-interval trap is a different
      # failure — valid to Grafana — and stays with the contract check.
      - name: Boot Grafana and resolve every dashboard against it
        env:
          GRAFANA_IMAGE: ${{ steps.images.outputs.grafana }}
        run: node scripts/check-grafana-dashboards.mjs

  # The image built by `Dockerfile` is the only artifact that ever reaches a
  # server, and until this job existed nothing in this workflow opened that file.
  # `deploy-config` above looks like coverage and is not: `docker compose config`
  # merges and prints compose YAML, and never reads the `Dockerfile` that
  # `build.dockerfile` points at. The wiring was checked; the image was not.
  #
  # What that left unchecked is not a second `cargo build`. The image has its own
  # failure modes, and every one of them is invisible to the other jobs here:
  #   * two by-name lists of `crates/*/Cargo.toml` — the COPY block in stage 2a
  #     and the `touch` list in stage 2d. A tenth workspace member that nobody
  #     adds to both fails `cargo build --release` on a manifest it cannot read.
  #   * a by-name list of frontend inputs in stage 1: a config file not named
  #     there is simply absent from the build. `web/.npmrc` already is, so the
  #     image's `npm ci` is laxer than the one the `frontend` job runs.
  #   * artifact paths hardcoded in stage 3 (`target/release/*`,
  #     `/build/web/build`). Moving adapter-static's output breaks the image and
  #     nothing else.
  #   * a toolchain drifting away from the one every other job installs. The
  #     image now builds with `rust-toolchain.toml` like everything else; its
  #     `rust:` tag only decides whether rustup has to download it first.
  # Each of those used to surface during a deploy, on the server.
  #
  # Nothing is pushed. The proof wanted here is that the image builds and its
  # binaries run; a registry would need credentials this workflow has no reason
  # to hold.
  #
  # Cost is why this one is path-gated instead of unconditional — it is the most
  # expensive job in the file by a wide margin, since `[profile.release]` is
  # `lto = true` with `codegen-units = 1`. Measured cold on 24 cores: 103s for
  # the dependency layer, 967s for the workspace build and the fat-LTO links,
  # ~18 minutes end to end for a 243 MB image. A two-core
  # hosted runner is well short of that, which is what the 120-minute ceiling
  # leaves room for; adjust it against a real run rather than downwards on
  # principle.
  #
  # The filter is a closed set rather than a guess: the Dockerfile's COPY
  # statements name every path that can enter the build (Cargo.toml, Cargo.lock,
  # crates/, web/), and .dockerignore and this workflow decide what the build
  # sees. Push to main and workflow_dispatch build unconditionally, so main is
  # never merely assumed to be shippable.
  docker-image:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        # Full history: the path gate diffs against the pull request's base
        # commit, which a depth-1 checkout does not have.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The decision is a step, not a job-level `if`, so the job always runs and
      # always reports. A required check that resolves to "skipped" looks exactly
      # like one that was never configured.
      - name: Decide whether this change can reach the image
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" != "pull_request" ] || [ -z "${BASE_SHA}" ]; then
            echo "build=true" >>"${GITHUB_OUTPUT}"
            echo "Event is ${EVENT_NAME} — building unconditionally."
            exit 0
          fi
          changed="$(git diff --name-only "${BASE_SHA}" HEAD)"
          echo "Files changed against ${BASE_SHA}:"
          printf '%s\n' "${changed}"
          # A here-string, not `printf | grep -q`: on a long file list grep
          # stops at the first match, printf dies of SIGPIPE, and pipefail
          # turns "an input changed" into a skipped image build.
          if grep -qE '^(Dockerfile|\.dockerignore|Cargo\.(toml|lock)|rust-toolchain\.toml|crates/|web/|scripts/openapi-interface-smoke\.mjs|\.github/workflows/regression\.yml)' <<<"${changed}"; then
            echo "build=true" >>"${GITHUB_OUTPUT}"
            echo "An input of the image build changed — building."
          else
            echo "build=false" >>"${GITHUB_OUTPUT}"
            echo "This pull request touches no input of the image build — skipping it."
          fi

      - name: Set up Buildx
        if: steps.scope.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # cache-from/to type=gha is what keeps a source-only pull request
      # affordable: stage 2c compiles the whole dependency tree and only has to
      # be redone when Cargo.lock or a crate manifest changes. mode=max is
      # required for that — the default caches only the exported image, and a
      # multi-stage build gets no reuse from it at all.
      #
      # The budget it shares is worth knowing about: GitHub gives a repository
      # 10 GB of Actions cache in total, the same pool `Swatinem/rust-cache`
      # draws on in six jobs above, and eviction is LRU across all of it. Its own
      # `scope` keeps this build's entries from colliding with those, not from
      # competing with them.
      #
      # `load: true` because the next step runs the binaries: without it the
      # image stays inside buildx and never reaches the daemon.
      - name: Build the production image
        if: steps.scope.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: plombir-git:ci
          cache-from: type=gha,scope=plombir-git-image
          cache-to: type=gha,scope=plombir-git-image,mode=max

      # A built image is not yet a working one. The runtime stage is a different
      # base (debian:bookworm-slim) from the builder (rust:1.99.0-slim-bookworm),
      # so a shared library the build linked against and the runtime does not
      # install produces a binary that compiles, copies, and then refuses to
      # start — on the server, in a restart loop, with the failure a line in
      # `docker logs` nobody reads until the deploy is already broken.
      #
      # `--help` rather than `--version`: the current binaries do not all
      # declare a version flag, and clap answers `--version` with exit 2. The
      # point is not the output anyway — an executable may ignore argv and exit
      # on stdin EOF. The point is that every binary copied into the image loads
      # its libraries and runs as the image's own
      # unprivileged user. `timeout` is there so a binary that ever starts
      # blocking fails this step instead of sitting until the job ceiling — set
      # far above the ~1s they currently take, because the bound exists to catch
      # a hang, and a bound tight enough to also catch a busy runner would make
      # this gate flaky, which is worse than not having it.
      - name: Run the binaries in the built image
        if: steps.scope.outputs.build == 'true'
        run: |
          set -euo pipefail
          mapfile -t binaries < <(
            docker run --rm --entrypoint find plombir-git:ci \
              /usr/local/bin -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
              | sort
          )
          if [ "${#binaries[@]}" -eq 0 ]; then
            echo "The image contains no files in /usr/local/bin." >&2
            exit 1
          fi
          for binary in "${binaries[@]}"; do
            echo "Running ${binary}"
            timeout 300 docker run --rm plombir-git:ci "${binary}" --help >/dev/null
          done

      # And a binary that starts is not yet a server that serves. This boots the
      # image the way `deploy/docker-compose.yml` does — the image's own CMD, a
      # JWT secret from the environment, nothing mounted — and then asks it the
      # two questions a broken image answers differently:
      #
      #   * `/health` reports the database, filesystem and git subsystems. An
      #     image missing libsqlite3 in the runtime stage, or one whose /data
      #     directories were never created with the right owner, fails here.
      #   * `/` must be the SPA. The frontend is built in a separate stage and
      #     copied to a path hardcoded in stage 3; if adapter-static's output
      #     moves, every other job stays green and this is the only place the
      #     server ends up with no frontend to serve.
      #
      # Locally the health endpoint answers 2s after start; the loop allows 60.
      # Logs are dumped on failure because a container that died has already
      # said why, and without this the step would report only a timeout.
      # For the OpenAPI routing check at the end of the next step. Pinned rather
      # than taken from the runner image, for the same reason the contract-check
      # job pins it: the version a gate runs under should be a decision, not an
      # image detail that changes under it.
      - name: Install Node
        if: steps.scope.outputs.build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Boot the built image and check it serves
        if: steps.scope.outputs.build == 'true'
        run: |
          set -euo pipefail
          trap 'docker rm -f plombir-git-smoke >/dev/null 2>&1 || true' EXIT

          docker run -d --name plombir-git-smoke \
            -e PLOMBIR_GIT_JWT_SECRET="$(openssl rand -hex 32)" \
            -p 127.0.0.1:18080:8080 \
            plombir-git:ci

          # Silent while polling (`-fs`, no `-S`): a refused connection during
          # the first second is the expected state, not a diagnostic, and
          # printing it once per attempt makes a passing run read like a failing
          # one. The authoritative attempt below keeps `-S` and does report.
          for _ in $(seq 1 60); do
            if curl -fs http://127.0.0.1:18080/health >/tmp/plombir-git-health.json; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:18080/health >/tmp/plombir-git-health.json; then
            echo "The container never became healthy. Its logs:" >&2
            docker logs plombir-git-smoke >&2 || true
            exit 1
          fi
          cat /tmp/plombir-git-health.json

          # The body is checked as well as the status code, and the two are not
          # the same assertion today only by the handler's choice: `health` in
          # crates/rg-http/src/handlers.rs answers 503 whenever a subsystem is
          # down, so `curl -f` above already rejects a degraded container. What
          # this catches is that choice changing — the status code and the
          # reported `status` drifting apart, which is the direction such a
          # handler usually drifts, since "degraded" reads as something short of
          # a hard failure. `/health`'s body, not its code, is what the image's
          # own HEALTHCHECK and the frontend's readiness banner go by.
          if ! grep -q '"status":"ok"' /tmp/plombir-git-health.json; then
            echo "The container is up but reports an unhealthy subsystem." >&2
            docker logs plombir-git-smoke >&2 || true
            exit 1
          fi

          # The image's own state files must land on the volume, not in the
          # container layer: a key kept in `$HOME/.ssh` is gone with the
          # container, and the next start refuses the database it encrypted.
          # The one-time setup token for the first account is held to the same
          # place, since the deploy guide sends the operator to /data for it.
          for state_file in /data/encryption_key /data/ssh_host_key /data/setup_token; do
            if ! docker exec plombir-git-smoke test -s "${state_file}"; then
              echo "The default command left ${state_file} missing: the server" >&2
              echo "keeps its keys outside the /data volume." >&2
              docker logs plombir-git-smoke >&2 || true
              exit 1
            fi
          done

          # The page is read whole before the search: piped into `grep -q`,
          # an index.html past one pipe buffer makes curl exit 23 on the early
          # match, and pipefail reports a frontend that is there as missing.
          if ! front_page="$(curl -fsS http://127.0.0.1:18080/)" \
            || ! grep -qi '<!doctype html' <<<"${front_page}"; then
            echo "The server is healthy but / is not the frontend — check the" >&2
            echo "web/build copy in the Dockerfile's runtime stage." >&2
            docker logs plombir-git-smoke >&2 || true
            exit 1
          fi

          # And a server that serves is not yet one that serves what its spec
          # advertises. This replays the published OpenAPI document against the
          # container and asserts that every path in it is claimed by a route.
          #
          # It runs here, inside this step, because this is the only job with a
          # live server — and the container is removed by the trap the moment
          # the step ends, so a separate step would find nothing to talk to.
          #
          # This is also the only place the assertion is worth anything: the
          # image is the one artefact where the SPA bundle exists, so a path
          # outside `/api/v1` answers `200 text/html` exactly as it would in
          # production. That is the failure the smoke was blind to for its whole
          # life — it requested every path without the `/api/v1` mount prefix,
          # got the SPA, and printed 288 green ticks. Inside
          # `/api/v1` an unrouted path is a JSON 404 that differs from a
          # handler's 404 only in its message, which is what the smoke compares.
          #
          # OPENAPI_SMOKE_ROUTING_ONLY keeps it to the anonymous, read-only pass:
          # one GET per advertised path, no registration, no bodies, no delete
          # verbs. The full replay stays a manual tool for a throwaway instance
          # — see scripts/full-interface-regression.mjs.
          # If the spec sits behind authentication, the smoke registers the
          # container's first account, which needs the setup token.
          OPENAPI_SMOKE_ROUTING_ONLY=1 \
          BACKEND_URL=http://127.0.0.1:18080 \
          STAND_SETUP_TOKEN="$(docker exec plombir-git-smoke cat /data/setup_token)" \
            node scripts/openapi-interface-smoke.mjs || {
              echo "The published OpenAPI spec does not match the routes this image serves." >&2
              docker logs plombir-git-smoke >&2 || true
              exit 1
            }

      # The README's first command, against this image: `plombir-git trial`
      # with nothing prepared — no secret, no config, no volume — then the setup
      # link it prints, the first account, a repository and a clone over HTTP.
      # A step of its own because the boot step above is about the production
      # CMD and its trap removes that container; this one must not inherit a
      # JWT secret from anywhere. release.yml runs the same script against the
      # image it has just published (card_794de0f08b9a).
      - name: Try the image the way the README's first command does
        if: steps.scope.outputs.build == 'true'
        env:
          TRIAL_HTTP_PORT: "18081"
          TRIAL_SSH_PORT: "12223"
        run: scripts/trial-smoke.sh plombir-git:ci
