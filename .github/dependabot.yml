version: 2
updates:
  # Every ecosystem sets `open-pull-requests-limit` on purpose. Dependabot's
  # default is 5 open PRs per ecosystem, and an update over the limit is not
  # queued or reported — it is simply not proposed. On 2026-10-15 the five slots
  # for github-actions were taken, and `actions/download-artifact` (four majors
  # behind) and `actions/setup-node` (still on the Node 20 runtime) were never
  # offered. A limit above the number of things each ecosystem pins is what
  # makes "no PR" mean "nothing to update".
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  # The third-party images CI runs: the PostgreSQL and MySQL services of the
  # smoke jobs and the two reverse proxies the deploy examples are loaded by.
  # They are pinned in a Dockerfile that is never built because no Dependabot
  # ecosystem reads a workflow's service image or a shell variable — see the
  # header of ci/images/Dockerfile. The directory must stay outside `.github/`:
  # a docker update under it is refused when Dependabot opens the pull request,
  # since only the github-actions ecosystem may write there.
  - package-ecosystem: docker
    directory: /ci/images
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # The MySQL smoke job tests an LTS line (8.4). MySQL's newer majors are
    # calendar-versioned innovation releases (26.10 on 2026-10-21, the same
    # image as `latest`), short-lived by design; Dependabot proposed one as an
    # ordinary bump (#46). Only 8.4.x digest updates come through here; moving
    # the job to the next LTS is a deliberate change.
    ignore:
      - dependency-name: mysql
        update-types:
          - version-update:semver-major
  # The observability stack pins its images by digest; this is what proposes
  # the next digest as a reviewable pull request.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 20
    # Minor and patch bumps of actions ride in one PR; a major keeps its own,
    # because that is the one that can change behaviour and gets reverted alone.
    groups:
      github-actions-minor:
        update-types:
          - minor
          - patch
