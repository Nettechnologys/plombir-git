[package]
name = "rg-core"
version.workspace = true
edition = "2021"
license.workspace = true
rust-version.workspace = true

[dependencies]
rg-db = { path = "../rg-db" }
rg-git = { path = "../rg-git" }
rg-process = { path = "../rg-process" }
gix = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
futures = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
semver = { workspace = true }
argon2 = { workspace = true }
password-hash = { workspace = true }
rand_core = { workspace = true, features = ["std"] }
jsonwebtoken = { workspace = true }
sea-orm = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
hmac = { workspace = true }
sha2 = { workspace = true }
sha1 = { workspace = true }
md-5 = { workspace = true }
hex = { workspace = true }
lettre = { workspace = true }
zstd = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true }
toml = { workspace = true }
serde-saphyr = { workspace = true }

# Auth / SSO / 2FA
base64 = { workspace = true }
totp-rs = { workspace = true }
qrcode = { workspace = true }
webauthn-rs = { workspace = true }
ldap3 = { workspace = true }
aes-gcm = { workspace = true }
ed25519-dalek = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
urlencoding = { workspace = true }
http = { workspace = true }
# Package uploads are spooled to a request-private temporary file rather than
# collected in heap; `PackageArtifact` owns that `TempPath`.
tempfile = { workspace = true }

# Effective uid/gid of the running process, for the bind-mount ownership
# diagnostic in `platform::fs::ownership_hint` (std exposes no uid API).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tokio-rustls = { workspace = true }
# Lets a test assert on the log line an operator would actually have seen —
# the only channel a background consumer has (see `log_write_queue` tests).
tracing-subscriber = { workspace = true }

[lints]
workspace = true
