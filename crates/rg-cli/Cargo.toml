[package]
name = "rg-cli"
version = "0.1.0"
edition = "2021"
description = "Plombir Git — self-hosted Git platform server (main binary)"
repository = "https://github.com/Nettechnologys/plombir-git"
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "plombir-git"
path = "src/main.rs"

[dependencies]
rg-core = { path = "../rg-core" }
rg-git = { path = "../rg-git" }
rg-ssh = { path = "../rg-ssh" }
rg-http = { path = "../rg-http" }
rg-db = { path = "../rg-db" }
rg-ci = { path = "../rg-ci" }
# The real CI-runner agent. `plombir-git runner` is a deprecated alias for
# `plombir-git-runner run` and delegates here instead of carrying its own copy of
# the poll-and-execute loop.
rg-runner = { path = "../rg-runner" }
rg-process = { path = "../rg-process" }
gix = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
same-file = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
