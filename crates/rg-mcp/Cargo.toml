[package]
name = "rg-mcp"
version = "0.1.0"
edition = "2021"
description = "ForgeKeep MCP server (stdio) exposing repository tools to AI agents"
repository = "https://github.com/Yahook/ForgeKeep"
license.workspace = true

[[bin]]
name = "forgekeep-mcp"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
urlencoding = "2"

# HTTP client (call ForgeKeep REST API)
reqwest = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Env / Config
dotenv = "0.15"
