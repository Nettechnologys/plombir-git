[package]
name = "rg-mcp"
version = "0.1.0"
edition = "2021"
description = "Plombir Git MCP server (stdio) exposing repository tools to AI agents"
repository = "https://github.com/Nettechnologys/plombir-git"
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "plombir-git-mcp"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
urlencoding = "2"

# HTTP client (call Plombir Git REST API)
reqwest = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Refuses to start on the environment of the project's former name
rg-process = { path = "../rg-process" }

[lints]
workspace = true
