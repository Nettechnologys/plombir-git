[package]
name = "rg-git"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[dependencies]
tokio = { workspace = true, features = ["process", "time", "io-util"] }
anyhow = { workspace = true }
tracing = { workspace = true }
gix = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
walkdir = "2"
tempfile = "3"
# `test-util` (paused clock via `start_paused`) is test-only so the idle-timeout
# unit tests advance virtual time deterministically instead of sleeping for real.
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }

[lints]
workspace = true
