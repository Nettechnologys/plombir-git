[package]
name = "rg-ssh"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[dependencies]
rg-git = { path = "../rg-git" }
rg-core = { path = "../rg-core" }
rg-db = { path = "../rg-db" }
tokio = { workspace = true }
russh = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
sea-orm = { workspace = true }
serde_json = { workspace = true }
# rand 0.10 supplies the RNG for host-key generation: `PrivateKey::random` bounds
# on rand_core 0.10's `CryptoRng`, which rand 0.10's `rng()` satisfies (russh 0.60
# itself generates keys the same way). The workspace `rand` is 0.8 and incompatible.
rand = "0.10"

[dev-dependencies]
chrono = { workspace = true }
tempfile = "3"
# The session-revocation tests drive the real `reset_password`, which takes the
# raw token and looks it up by SHA-256 hex — so the fixture has to mint one the
# same way rather than poke `invalidate_sessions` directly.
sha2 = { workspace = true }
hex = { workspace = true }
# Skip the unreadable-host-key test when running as root, which ignores mode bits.
libc = "0.2"

[lints]
workspace = true
