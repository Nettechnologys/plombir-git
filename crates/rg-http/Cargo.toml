[package]
name = "rg-http"
version = "0.1.0"
edition = "2021"
license.workspace = true
rust-version.workspace = true

[dependencies]
rg-git = { path = "../rg-git" }
rg-core = { path = "../rg-core" }
rg-db = { path = "../rg-db" }
gix = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
tokio-rustls = { workspace = true }
axum-server = { workspace = true }
utoipa = { version = "5", features = ["chrono"] }
utoipa-swagger-ui = "8"
uuid = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
prometheus = { version = "0.13", default-features = false }
tokio-util = { version = "0.7", features = ["io", "rt"] }
http-body-util = "0.1"
tokio-stream = "0.1"
zstd = "0.13"
http-body = "1"
tempfile = "3"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "multipart"] }
serde_urlencoded = "0.7"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tar = "0.4"
flate2 = "1"
zip = { workspace = true }
socket2 = "0.5"
jsonwebtoken = { workspace = true }
tokio-tungstenite = "0.29"
# Checks that the RubyGems `versions` index publishes the MD5 of the very
# `info` body the server answers with — the pair is what a client caches on.
md-5 = { workspace = true }
# Same shape for npm and Composer: `dist.shasum` is SHA-1 by protocol, so the
# test has to hash the downloaded file the way the client would.
sha1 = { workspace = true }
# Helm's `index.yaml` is asserted on as a parsed document, not as text: a
# `contains` check passes on a key that landed under the wrong chart.
serde_yaml = { workspace = true }
# The archive-stream regression test asserts on the warning an operator sees
# when `git archive` stdout fails after the 200 response has started.
tracing-subscriber = { workspace = true }
# `POST /users/mfa/enable` is the one endpoint whose failure branch cannot be
# reached without presenting a real second factor, so the enrolment-atomicity
# test derives the current code from the secret `POST /users/mfa/setup` returns.
totp-rs = { workspace = true }

[lints]
workspace = true
