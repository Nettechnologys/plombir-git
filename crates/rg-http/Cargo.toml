[package]
name = "rg-http"
version.workspace = true
edition = "2021"
license.workspace = true
rust-version.workspace = true

[dependencies]
rg-git = { path = "../rg-git" }
rg-core = { path = "../rg-core" }
rg-db = { path = "../rg-db" }
# The MCP tools, served in-process at `POST /api/v1/mcp`.
rg-mcp = { path = "../rg-mcp" }
gix = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sea-orm = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# Stock git gzips stateless upload-pack request bodies over 1 KiB.
flate2 = { workspace = true }
tokio-rustls = { workspace = true }
axum-server = { workspace = true }
utoipa = { version = "5", features = ["chrono"] }
utoipa-swagger-ui = "8"
uuid = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
prometheus = { version = "0.13", default-features = false }
tokio-util = { workspace = true, features = ["io", "rt"] }
http-body-util = { workspace = true }
tokio-stream = { workspace = true }
zstd = { workspace = true }
http-body = { workspace = true }
tempfile = { workspace = true }
urlencoding = { workspace = true }

[features]
# `create_router_for_test*`: the production route set without its per-client
# rate limiters. Only this crate's integration tests build them, through the
# self dev-dependency below; a binary linking rg-http never sees them.
test-support = []

[dev-dependencies]
rg-http = { path = ".", features = ["test-support"] }
sea-orm-migration = { workspace = true }
# The MCP server's tools are thin wrappers over these routes, and nothing in
# `rg-mcp` can tell whether the path one of them builds is a route this crate
# mounts. `mcp_content_tools_tests` drives them through `call_tool` against the
# live router so that question is answered where both halves exist.
rg-mcp = { path = "../rg-mcp" }
# The CI runner agent builds twelve `/api/v1/runners/...` URLs as format strings
# in a crate that cannot see this one's route table. `runner_route_coverage_tests`
# drives those very functions against the live router, which is the only place
# both halves of that agreement exist.
rg-runner = { path = "../rg-runner" }
reqwest = { workspace = true, features = ["multipart"] }
serde_urlencoded = "0.7"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
tar = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
socket2 = "0.5"
jsonwebtoken = { workspace = true }
tokio-tungstenite = "0.29"
# Checks that the RubyGems `versions` index publishes the MD5 of the very
# `info` body the server answers with — the pair is what a client caches on.
md-5 = { workspace = true }
# Same shape for npm and Composer: `dist.shasum` is SHA-1 by protocol, so the
# test has to hash the downloaded file the way the client would.
sha1 = { workspace = true }
# The archive-stream regression test asserts on the warning an operator sees
# when `git archive` stdout fails after the 200 response has started.
tracing-subscriber = { workspace = true }
# `POST /users/mfa/enable` is the one endpoint whose failure branch cannot be
# reached without presenting a real second factor, so the enrolment-atomicity
# test derives the current code from the secret `POST /users/mfa/setup` returns.
totp-rs = { workspace = true }

[lints]
workspace = true
