[workspace]
members = [
    "crates/rg-cli",
    "crates/rg-core",
    "crates/rg-git",
    "crates/rg-ssh",
    "crates/rg-http",
    "crates/rg-db",
    "crates/rg-ci",
    "crates/rg-runner",
    "crates/rg-process",
    "crates/rg-mcp",
]
resolver = "2"

# Shared package metadata inherited by every crate via `license.workspace = true`.
# The whole workspace is proprietary (see LICENSE / NOTICE, © Yahook), so the
# license lives in one place instead of being repeated (or, worse, drifting)
# per crate. `LicenseRef-Proprietary` is a valid SPDX license-ref for a custom,
# non-standard license whose full text ships in the LICENSE file.
[workspace.package]
license = "LicenseRef-Proprietary"
# Minimum Supported Rust Version. Floored by the toughest dependencies in the
# tree — russh 0.60 and rand 0.10 both declare `rust-version = "1.85"`. Bump only
# deliberately (a bump is a breaking change for downstream builders). Every crate
# inherits this via `rust-version.workspace = true`.
rust-version = "1.85"

# Regression guard for CWE-833: holding a non-async lock guard across an `.await`
# blocks the tokio worker and risks deadlock/DoS. clippy already warns on this by
# default; deny it workspace-wide so `cargo clippy` fails instead of merely
# warning. Covers std/parking_lot Mutex+RwLock guards and RefCell refs held over
# await. Every crate opts in via `[lints] workspace = true`.
[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
let_underscore_must_use = "deny"
let_underscore_future = "warn"

[workspace.dependencies]
# HTTP
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "limit"] }

# SSH
# russh 0.60.3 is the first release fixing RUSTSEC-2026-0153/0154 (unbounded
# CryptoVec / 32-bit allocation DoS in the SSH transport). russh-keys was folded
# into `russh::keys` in 0.52+, so the standalone crate is dropped — all key code
# already goes through `russh::keys::*`.
russh = "0.60.3"

# Database — SeaORM's default features already bundle all three sqlx backends
# (sqlite + postgres + mysql) plus with-chrono/with-uuid, so ForgeKeep can select
# the backend at runtime via the `database_url` scheme without a feature rebuild.
# Database — keep SeaORM default features (with-chrono/with-uuid/…) and enable
# all three sqlx backends so the backend is chosen at runtime via the
# `database_url` scheme (sqlite:// / postgres:// / mysql://).
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls", "macros"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
libc = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
quick-xml = { version = "0.38", features = ["serialize"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Auth
argon2 = "0.5"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto", "use_pem"] }
password-hash = "0.5"
rand_core = "0.6"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "hostname", "smtp-transport"] }

# Crypto
hmac = "0.12"
sha2 = "0.10"
# Not a security primitive here: the RubyGems compact index specifies MD5 as the
# cache key of an `info` file, and a client compares it against its own
# `Digest::MD5` of the cached copy. Any other digest would simply never match.
md-5 = "0.10"
# Same reason: `dist.shasum` is SHA-1 by definition in both the npm and the
# Composer protocol, and a client hashes the file it downloaded with SHA-1 to
# compare. Publishing a stronger digest under that name only fails the check.
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
aes-gcm = "0.10"
ed25519-dalek = { version = "2.2", features = ["pkcs8", "pem"] }
# Comparing a TOTP candidate against the presented code. A hand-rolled XOR-fold
# is the same arithmetic, but nothing stops the optimiser from restoring an early
# exit through it; `subtle`'s whole purpose is to hold that guarantee. Already in
# the lock through `aes-gcm` and `ed25519-dalek`, so this costs no extra build.
subtle = "2.6"

# TOTP / 2FA
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
qrcode = "0.14"
rand = "0.8"

# WebAuthn / passkeys. `danger-allow-state-serialisation` lets us persist the
# in-progress registration/authentication ceremony state (PasskeyRegistration /
# PasskeyAuthentication) into a short-lived signed cookie between the begin and
# finish HTTP round-trips — ForgeKeep keeps no server-side session store.
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

# LDAP
ldap3 = { version = "0.11", features = ["tls"] }

# TLS
tokio-rustls = "0.26"
axum-server = { version = "0.7", features = ["tls-rustls"] }

# Config
toml = "0.8"

# Log rotation
tracing-appender = "0.2"

# OpenTelemetry — distributed tracing exported over OTLP/HTTP. The exporter uses
# the blocking reqwest client with rustls (no OpenSSL, matching the rest of the
# tree) and the thread-based batch span processor, so no extra tokio runtime is
# needed. Traces are opt-in (see `[observability]` in the config); with no OTLP
# endpoint set, none of this machinery runs. tracing-opentelemetry 0.33 pins
# opentelemetry 0.32 — keep the four crates on the same release train on bump.
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "trace",
    "http-proto",
    "reqwest-blocking-client",
    "reqwest-rustls",
] }
tracing-opentelemetry = "0.33"

# Git library (replacing git CLI)
gix = { version = "0.84", features = [
    "blocking-http-transport-curl",
    "max-performance",
    "blob-diff",
    "pack-cache-lru-dynamic",
    "merge",
] }

# Archive / compression
flate2 = "1"
tar = "0.4"
zip = "2"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"
regex = "1"
home = "0.5"
fs2 = "0.4"

# DB migration
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls"] }

# Argon2id at the production parameters (m=19 MiB, t=2) is deliberately
# expensive, and an unoptimized build makes it far worse. Measured on one
# hash, configurations interleaved so machine drift cannot fake the result:
#
#   argon2 built with opt-level=0   347.6 / 347.2 ms
#   argon2 built with opt-level=3    15.2 /  15.4 ms   → 22.8x
#
# Every test that registers or logs in a user pays that; the suite has 130+
# such call sites, so this is worth roughly 45-50s of a full run. Do not try
# to confirm that at the level of the whole suite — run-to-run variance here
# spans several times the effect (the same configuration has produced 199s
# and 502s of summed test time), which is why the number above is measured on
# the operation itself rather than end to end.
#
# Optimizing only the two hashing crates keeps the tests honest: same
# algorithm, same cost parameters, same code path as production. The
# alternative — lowering m_cost/t_cost for tests — buys the same speed by no
# longer exercising what production runs. blake2 is required as well; argon2
# 0.5 does its core hashing through it.
[profile.dev]
debug = "line-tables-only"

# Keep the DWARF in the object files instead of copying it into every binary at
# link time. The workspace produces ~50 test binaries, each statically linking
# the same dependency graph, and each was carrying its own ~130 MB copy of the
# same debug info (measured on `integration`: .debug_line 49 MB + .debug_str
# 43 MB + .debug_info 21 MB + .debug_ranges 10 MB, of a 323 MB binary). Every
# relink wrote all of it again, and this host is I/O-bound long before it is
# CPU-bound (`/proc/pressure/io` sits around 25% "full" during a build).
#
# Measured, same machine, `touch crates/rg-core/src/lib.rs` then
# `cargo test --workspace --no-run -j 6`:
#
#   off (default)   98.8 s
#   unpacked        41.3 / 46.5 s      → 2.1-2.4x
#
# and `cargo test -p rg-http --no-run` after touching rg-http: 45.2 s → 18-30 s.
#
# Backtraces keep their line numbers as long as the `.dwo` files stay beside the
# binary in `target/`, which is where every dev and CI run executes them. Release
# builds are untouched — `[profile.release]` strips debug info outright, so the
# docker image is byte-for-byte what it was.
split-debuginfo = "unpacked"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = 3
