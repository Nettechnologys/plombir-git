# Plombir Git Docker Compose — env vars + named volume (the simple variant).
#
# Quick start (run from the repo root):
#   1. install -m 600 deploy/.env.example deploy/.env  (it holds the secret
#      in plain text, so do not let a stock umask publish it)
#   2. Set PLOMBIR_GIT_JWT_SECRET in deploy/.env, for example:
#        openssl rand -hex 32
#   3. docker compose -f deploy/docker-compose.yml up -d
#
# Want the data on a host path you can back up, and the settings in a
# plombir-git.toml instead of flags? Use `deploy/docker-compose.hostdir.yml` —
# it is the same stack with a bind-mounted ./data, a config file, and the
# uid/permission traps of bind-mounts already handled. See deploy/README.md.
#
# For observability (Prometheus + Grafana + Alertmanager):
#   docker compose -f deploy/docker-compose.observability.yml up -d

services:
  plombir-git:
    build:
      # Context is the repo root (this file lives in deploy/), where the
      # Dockerfile and crates/ live.
      context: ..
      dockerfile: Dockerfile
      args:
        # The commit being built, so every page links its exact source:
        #   PLOMBIR_GIT_SOURCE_COMMIT=$(git rev-parse HEAD) docker compose up -d --build
        PLOMBIR_GIT_SOURCE_COMMIT: ${PLOMBIR_GIT_SOURCE_COMMIT:-}
    container_name: plombir-git
    restart: unless-stopped
    # Loopback only: this is the try-out stack, and on an empty instance the
    # first account registered becomes its administrator. Register yours, then
    # put a TLS proxy in front of 127.0.0.1:8080 or drop the "127.0.0.1:"
    # prefixes. See deploy/README.md.
    ports:
      - "127.0.0.1:8080:8080"   # HTTP
      - "127.0.0.1:2222:2222"   # SSH
    volumes:
      # Persistent data (repos, DB, logs)
      - plombir-git-data:/data
      # Config file (optional — mount your plombir-git.toml here)
      # - ./plombir-git.toml:/app/plombir-git.toml:ro
      # SSH host key (persist to avoid key change on restart)
      # - ./ssh_host_key:/app/ssh_host_key:ro
    # PLOMBIR_GIT_JWT_SECRET is required and is read from deploy/.env.
    # Optional SMTP settings can also be added to that file.
    env_file:
      # The override is used by the local config gate to validate against an
      # isolated throwaway file; normal deployments keep reading this .env.
      - ${PLOMBIR_GIT_DEPLOY_ENV_FILE:-.env}
    # Uncomment to use config file instead of env vars:
    # command: >
    #   plombir-git serve
    #   --config /app/plombir-git.toml
    networks:
      - plombir-git-net

  # ── Optional: CI Runner ─────────────────────────────────
  # runner:
  #   build:
  #     context: ..
  #     dockerfile: Dockerfile
  #   container_name: plombir-git-runner
  #   restart: unless-stopped
  #   command: >
  #     plombir-git-runner run
  #     --server http://plombir-git:8080
  #     --runner-id ${PLOMBIR_GIT_RUNNER_ID}
  #     --token ${PLOMBIR_GIT_RUNNER_TOKEN}
  #   environment:
  #     - PLOMBIR_GIT_RUNNER_ID=1
  #     - PLOMBIR_GIT_RUNNER_TOKEN=your-runner-token
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock  # for Docker CI jobs
  #     - plombir-git-data:/data
  #   depends_on:
  #     - plombir-git

volumes:
  plombir-git-data:
    driver: local

networks:
  plombir-git-net:
    name: plombir-git-net
    driver: bridge
