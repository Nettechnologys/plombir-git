# ForgeKeep Docker Compose — env vars + named volume (the simple variant).
#
# Quick start (run from the repo root):
#   1. install -m 600 deploy/.env.example deploy/.env  (it holds the secret
#      in plain text, so do not let a stock umask publish it)
#   2. Set FORGEKEEP_JWT_SECRET in deploy/.env, for example:
#        openssl rand -hex 32
#   3. docker compose -f deploy/docker-compose.yml up -d
#
# Want the data on a host path you can back up, and the settings in a
# forgekeep.toml instead of flags? Use `deploy/docker-compose.hostdir.yml` —
# it is the same stack with a bind-mounted ./data, a config file, and the
# uid/permission traps of bind-mounts already handled. See deploy/README.md.
#
# For observability (Prometheus + Grafana + Alertmanager):
#   docker compose -f deploy/docker-compose.observability.yml up -d

services:
  forgekeep:
    build:
      # Context is the repo root (this file lives in deploy/), where the
      # Dockerfile and crates/ live.
      context: ..
      dockerfile: Dockerfile
    container_name: forgekeep
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "2222:2222"   # SSH
    volumes:
      # Persistent data (repos, DB, logs)
      - forgekeep-data:/data
      # Config file (optional — mount your forgekeep.toml here)
      # - ./forgekeep.toml:/app/forgekeep.toml:ro
      # SSH host key (persist to avoid key change on restart)
      # - ./ssh_host_key:/app/ssh_host_key:ro
    # FORGEKEEP_JWT_SECRET is required and is read from deploy/.env.
    # Optional SMTP settings can also be added to that file.
    env_file:
      # The override is used by the local config gate to validate against an
      # isolated throwaway file; normal deployments keep reading this .env.
      - ${FORGEKEEP_DEPLOY_ENV_FILE:-.env}
    # Uncomment to use config file instead of env vars:
    # command: >
    #   forgekeep serve
    #   --config /app/forgekeep.toml
    networks:
      - forgekeep-net

  # ── Optional: CI Runner ─────────────────────────────────
  # runner:
  #   build:
  #     context: ..
  #     dockerfile: Dockerfile
  #   container_name: forgekeep-runner
  #   restart: unless-stopped
  #   command: >
  #     forgekeep-runner run
  #     --server http://forgekeep:8080
  #     --runner-id ${FORGEKEEP_RUNNER_ID}
  #     --token ${FORGEKEEP_RUNNER_TOKEN}
  #   environment:
  #     - FORGEKEEP_RUNNER_ID=1
  #     - FORGEKEEP_RUNNER_TOKEN=your-runner-token
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock  # for Docker CI jobs
  #     - forgekeep-data:/data
  #   depends_on:
  #     - forgekeep

volumes:
  forgekeep-data:
    driver: local

networks:
  forgekeep-net:
    name: forgekeep-net
    driver: bridge
