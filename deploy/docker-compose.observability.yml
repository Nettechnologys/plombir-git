# Plombir Git Observability Stack
# Prometheus + Alertmanager + Grafana
#
# Every image is pinned as `tag@sha256:<digest>`. The tag is for the reader;
# the digest is what Docker pulls, so a redeploy of the same commit runs the same
# bytes instead of whatever the registry serves under that tag today. Each digest
# is the multi-platform index (manifest list), so amd64 and arm64 hosts both
# resolve. Dependabot (`.github/dependabot.yml`, `docker-compose`) proposes new
# digests as pull requests, and `scripts/observability-compose-contract-check.mjs`
# refuses a service without one.

services:
  # ── Prometheus (Metrics Storage) ──
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: plombir-git-prometheus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # Every port of this stack is loopback-only: Prometheus and Alertmanager
    # have no authentication (anyone could silence alerts), and node-exporter
    # describes the host. Reach them through an SSH tunnel or an authenticating
    # proxy.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      # No `--web.enable-lifecycle`: it adds an unauthenticated `POST /-/quit`
      # and `POST /-/reload`, so anything that reaches the port — a tunnel left
      # open, another container on the host, an SSRF from the app — could stop
      # Prometheus or make it load an edited config. The loopback bind narrows
      # the audience; it does not authenticate it. After editing
      # prometheus.yml or alerts.yml, run
      #   docker compose -f docker-compose.observability.yml restart prometheus
      # (or `docker kill -s HUP plombir-git-prometheus`) instead.
    depends_on:
      - alertmanager
    networks:
      - plombir-git-net

  # ── Alertmanager (Alert Routing) ──
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: plombir-git-alertmanager
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - plombir-git-net

  # ── Grafana (Visualization) ──
  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: plombir-git-grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # Required: no admin/admin fallback (see deploy/.env.example).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
      # Grafana 12+ otherwise downloads newer versions of its bundled plugins
      # (prometheus, postgresql, ...) from grafana.com on every start, so the
      # code drawing the dashboards is not the code the digest above pins.
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - plombir-git-net

  # ── Node Exporter (Host Metrics) ──
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: plombir-git-node-exporter
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # The whole host filesystem, read-only, for the filesystem collector. It
      # is tolerable only because 9100 is published on 127.0.0.1 above — never
      # widen that bind without dropping this mount.
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      # The host's / is already here; without this node-exporter (1.9 and
      # later) looks for udev device properties in its own /run and logs an
      # ERROR on every start.
      - '--path.udev.data=/rootfs/run/udev/data'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - plombir-git-net

volumes:
  prometheus-data:
    driver: local
  alertmanager-data:
    driver: local
  grafana-data:
    driver: local

networks:
  plombir-git-net:
    name: plombir-git-net
    driver: bridge
