# Plombir Git Observability Stack (Phase 22-C)
# Prometheus + Alertmanager + Grafana

services:
  # ── Prometheus (Metrics Storage) ──
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: plombir-git-prometheus
    restart: unless-stopped
    # Every port of this stack is loopback-only: Prometheus and Alertmanager
    # have no authentication (anyone could silence alerts), and node-exporter
    # describes the host. Reach them through an SSH tunnel or an authenticating
    # proxy.
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      # No `--web.enable-lifecycle`: it adds an unauthenticated `POST /-/quit`
      # and `POST /-/reload`, so anything that reaches the port — a tunnel left
      # open, another container on the host, an SSRF from the app — could stop
      # Prometheus or make it load an edited config. The loopback bind narrows
      # the audience; it does not authenticate it. After editing
      # prometheus.yml or alerts.yml, run
      #   docker compose -f docker-compose.observability.yml restart prometheus
      # (or `docker kill -s HUP plombir-git-prometheus`) instead.
    depends_on:
      - alertmanager
    networks:
      - plombir-git-net

  # ── Alertmanager (Alert Routing) ──
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: plombir-git-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - plombir-git-net

  # ── Grafana (Visualization) ──
  grafana:
    image: grafana/grafana:11.3.0
    container_name: plombir-git-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # Required: no admin/admin fallback (see deploy/.env.example).
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - plombir-git-net

  # ── Node Exporter (Host Metrics) ──
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: plombir-git-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # The whole host filesystem, read-only, for the filesystem collector. It
      # is tolerable only because 9100 is published on 127.0.0.1 above — never
      # widen that bind without dropping this mount.
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - plombir-git-net

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  plombir-git-net:
    name: plombir-git-net
    driver: bridge
