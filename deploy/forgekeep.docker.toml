# ForgeKeep configuration for the containerised deployment.
#
#   install -m 600 forgekeep.docker.toml forgekeep.toml
#
# and edit `forgekeep.toml` — that is the file `docker-compose.hostdir.yml`
# bind-mounts. It has to exist *before* `docker compose up`, otherwise Docker
# creates a directory at the mount point and the server refuses to start.
#
# Every path below is a path *inside the container*. The compose file mounts
# the host directory `./data` onto `/data`, so everything the server persists
# ends up in that one host directory — back it up and you have backed up the
# whole instance.
#
# Precedence: env var > CLI flag > this file > built-in default.

[server]
repo_root = "/data/repos"
http_addr = "0.0.0.0:8080"
ssh_addr = "0.0.0.0:2222"
# The SSH host key is generated on first start and kept in the data directory,
# so client `known_hosts` entries survive a rebuild. Deliberately NOT a
# separate bind-mount: mounting a file that does not exist yet gets you a
# directory here, which is not a key.
host_key = "/data/ssh_host_key"
# Public URL of this instance, used in emails and webhook payloads. Set it to
# whatever your reverse proxy serves.
# external_url = "https://git.example.com"

[database]
url = "sqlite:///data/forgekeep.db?mode=rwc"

[auth]
# Left unset on purpose: keep the secret in deploy/.env as
# FORGEKEEP_JWT_SECRET (the env var wins over this file), so a config file that
# accidentally lands in git carries no credentials.
# jwt_secret = "..."
#
# The at-rest encryption key needs no .env value: on first start the server
# creates /data/encryption_key (next to the SSH host key, mode 0600) and keeps
# using it across rebuilds. FORGEKEEP_ENCRYPTION_KEY remains available for KMS
# or vault-backed deployments and wins over the file.
# encryption_key = "..."
# key_file = "/data/encryption_key"
#
# Whether strangers may create accounts on this instance. "closed" makes
# POST /api/v1/users/register answer 403 — the first account (on an empty
# instance) and LDAP/SSO auto-provision still go through. [rate_limit].auth_max
# below only throttles sign-up; this is what refuses it. Set it to "closed"
# before exposing the HTTP port to anything you do not control.
# Also settable as FORGEKEEP_REGISTRATION in deploy/.env, which wins.
registration = "open"

# Keep custom OIDC discovery, client secrets and access tokens on HTTPS. A
# legacy IdP without TLS must be named by exact HTTP origin; paths, wildcards,
# and neighbouring hosts/ports do not inherit the exception.
allow_insecure_oidc_origins = []
# Example exact origins: ["http://idp.internal.example:8080"]

# Keep service-bind and user passwords on certificate-verified LDAPS. A legacy
# plaintext directory needs an exact ldap://host:port exception; a custom port
# without the ldap:// scheme remains TLS.
allow_insecure_ldap_endpoints = []
# Example exact endpoints: ["ldap://directory.internal.example:1389"]

[webhooks]
# Keep outbound webhook payloads and signatures on HTTPS. Set true only for an
# operator-controlled development network without TLS termination; private and
# loopback targets remain blocked by the independent SSRF policy.
allow_insecure_http = false

[ci]
# Run CI jobs in Docker containers. Requires mounting the host Docker socket
# into the runner, which is root-equivalent access to the host — see the
# commented `runner` service in docker-compose.hostdir.yml.
docker = false
# Keep false on any shared or public instance: with it on, pushed CI config
# executes arbitrary shell directly in the container.
allow_host_runner = false

[rate_limit]
max = 0          # 0 = no global per-IP limit
window_secs = 60
# Behind a reverse proxy, list the proxy's IP so X-Forwarded-For is trusted for
# rate limiting — without it every request looks like it comes from the proxy.
# trusted_proxies = ["172.17.0.1"]
auth_max = 10
auth_window_secs = 60

[logging]
# Left unset on purpose: with no `file`, the server logs to stdout, which is
# where `docker compose logs -f` and every Docker log driver read from. Setting
# a file here silently empties `docker compose logs`.
# Uncomment to log into the data directory instead (rotated daily,
# max_files caps how many are kept):
# file = "/data/logs/forgekeep.log"
max_files = 5

[audit]
enabled = true
archive_dir = "/data/audit-archive"
archive_after_days = 90
interval_minutes = 60
batch_size = 1000

[backup]
# Scheduled `VACUUM INTO` snapshots of the SQLite database, taken by the server
# itself — no cron entry on the host, and no way to snapshot the wrong database.
# `/data` is the mounted volume, so the snapshots survive
# `docker compose up --force-recreate`; a path under the image's `WORKDIR /app`
# would not.
#
# Budget for this: keep_last x the size of /data/forgekeep.db.
enabled = true
dir = "/data/backups"
interval_hours = 24
keep_last = 7
# This does NOT back up /data/repos. Snapshot the whole /data volume for that
# (or accept that bare repos are recoverable from developer clones).

[imports]
# Private self-hosted GitLab/GHES imports are opt-in. List exact HTTP(S)
# origins only; paths and wildcards are rejected, and a different host/port or
# cross-origin redirect never inherits this trust or receives the import PAT.
trusted_origins = []
# trusted_origins = ["https://gitlab.internal.example:8443"]
# A private-origin exception above does NOT permit plaintext credentials. If a
# legacy self-hosted source genuinely has no TLS endpoint, name its exact HTTP
# origin again here as a separate acknowledgement of that exposure.
allow_insecure_http_origins = []
# Example exact origins: ["http://gitlab.internal.example:8080"]

[mirror]
# The sweep that refreshes repository mirrors on the interval each mirror was
# configured with. On by default; set false if this instance should only refresh
# a mirror when someone presses "Sync now" — which also stops the container
# making outbound git calls to operator-supplied remotes on a timer.
enabled = true
# Keep credentials and repository content on HTTPS. Plain HTTP is an explicit
# instance-operator exception and never relaxes the separate SSRF policy. This
# is HTTP-only: native git:// remains disabled, including for legacy rows.
allow_insecure_http = false
poll_interval_secs = 60
batch_size = 10
