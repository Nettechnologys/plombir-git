# Plombir Git Alert Rules
# Phase 22-C: Observability Stack
groups:
  # HTTP/API alerts
  - name: plombir_git_http
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (route)
            /
          sum(rate(http_requests_total[5m])) by (route)
            > 0.05
        for: 5m
        labels:
          severity: critical
          service: plombir-git
        annotations:
          summary: "High HTTP 5xx error rate on {{ $labels.route }}"
          description: "{{ $labels.route }} has error rate {{ $value | humanizePercentage }} for 5+ minutes."

      # Slow requests
      - alert: SlowRequestDuration
        expr: |
          histogram_quantile(0.95, sum by (le, route) (rate(http_request_duration_seconds_bucket[5m])))
            > 1.0
        for: 10m
        labels:
          severity: warning
          service: plombir-git
        annotations:
          summary: "P95 latency on {{ $labels.route }} exceeds 1s"
          description: "P95 = {{ $value }}s for route {{ $labels.route }}."

      # In-flight spike
      - alert: HighInFlightRequests
        expr: http_requests_in_flight > 100
        for: 5m
        labels:
          severity: warning
          service: plombir-git
        annotations:
          summary: "High number of in-flight requests: {{ $value }}"
          description: "May indicate traffic spike or service degradation."

  # Database alerts
  - name: plombir_git_database
    interval: 30s
    rules:
      # Slow DB queries
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95, sum by (le, operation) (rate(db_query_duration_seconds_bucket[5m])))
            > 0.5
        for: 10m
        labels:
          severity: warning
          service: plombir-git
        annotations:
          summary: "P95 DB query duration exceeds 500ms for {{ $labels.operation }}"
          description: "P95 = {{ $value }}s. Check for missing indexes or slow queries."

      # DB query spike
      - alert: HighDatabaseQPS
        expr: sum by (operation) (rate(db_queries_total[5m])) > 1000
        for: 5m
        labels:
          severity: info
          service: plombir-git
        annotations:
          summary: "High DB QPS for {{ $labels.operation }}: {{ $value }} req/s"
          description: "May indicate hot table or missing cache."

  # Git operations alerts
  - name: plombir_git_git
    interval: 30s
    rules:
      # Slow Git fetch/clone/pull (upload-pack). The server emits the "fetch"
      # operation label for all upload-pack traffic (clone and incremental
      # fetch are indistinguishable at the wire protocol); "push" covers
      # receive-pack.
      - alert: SlowGitFetch
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(git_operation_duration_seconds_bucket[5m])))
            > 30
        for: 15m
        labels:
          severity: warning
          service: plombir-git
        annotations:
          summary: "P95 git operation latency exceeds 30s"
          description: "P95 = {{ $value }}s. Check disk I/O and pack file access."

      # Git operation failures (approximation via HTTP 5xx on /git/*)
      - alert: HighGitOperationFailure
        expr: |
          sum(rate(http_requests_total{status=~"5..", route=~"/git/.*"}[5m]))
            > 0.1
        for: 5m
        labels:
          severity: critical
          service: plombir-git
        annotations:
          summary: "High Git operation failure rate"
          description: "Git endpoints returning 5xx errors at {{ $value }} req/s."

  # CI/CD alerts
  - name: plombir_git_cicd
    interval: 30s
    rules:
      # Pipeline failure rate
      - alert: HighPipelineFailureRate
        expr: |
          sum(rate(ci_pipelines_total{status="failed"}[1h]))
            /
          sum(rate(ci_pipelines_total[1h]))
            > 0.3
        for: 30m
        labels:
          severity: warning
          service: plombir-git
        annotations:
          summary: "Pipeline failure rate exceeds 30%"
          description: "{{ $value | humanizePercentage }} of pipelines failed in the last hour."

      # Job queue buildup
      - alert: CIJobQueueBuildup
        expr: ci_jobs_running > 50
        for: 15m
        labels:
          severity: warning
          service: plombir-git
        annotations:
          summary: "CI job queue buildup: {{ $value }} jobs running"
          description: "Consider adding more runners."

  # Health/availability alerts
  - name: plombir_git_health
    interval: 15s
    rules:
      # Health check failure (requires blackbox or up{} check)
      - alert: PlombirGitDown
        expr: up{job="plombir-git"} == 0
        for: 2m
        labels:
          severity: critical
          service: plombir-git
        annotations:
          summary: "Plombir Git is DOWN"
          description: "Target has been unreachable for 2+ minutes. Page on-call!"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))
            > 0.9
        for: 10m
        labels:
          severity: warning
          service: plombir-git
        annotations:
          summary: "Host memory usage > 90%"
          description: "Memory pressure: {{ $value | humanizePercentage }}. Consider scaling or investigating leak."

      # Disk space low
      - alert: LowDiskSpace
        expr: |
          (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes))
            > 0.85
        for: 10m
        labels:
          severity: warning
          service: plombir-git
        annotations:
          summary: "Disk usage > 85% on {{ $labels.instance }}"
          description: "Filesystem: {{ $labels.mountpoint }} at {{ $value | humanizePercentage }}."

  # Backup alerts
  #
  # These only fire where `[backup].enabled = true`; with scheduled backups off
  # the series does not exist and the alerts stay silent by design — the "is
  # this instance backed up at all?" question is answered by the config file and
  # the startup log line, not by an alert that cannot tell "off" from "broken".
  - name: plombir_git_backup
    interval: 60s
    rules:
      # The one that matters: a backup task can keep running while every run
      # fails, so alert on the age of the last *successful* snapshot rather than
      # on failures. 0 = never succeeded since this process started, which is
      # also worth paging about once the grace window has passed.
      - alert: BackupTooOld
        expr: |
          (time() - plombir_git_db_backup_last_success_timestamp_seconds > 36 * 3600)
          or
          (plombir_git_db_backup_last_success_timestamp_seconds == 0)
        for: 30m
        labels:
          severity: critical
          service: plombir-git
        annotations:
          summary: "No successful database backup in over 36h"
          description: "Check `docker compose logs | grep 'database backup'` — the run fails with the reason and the directory. Tuned for the default [backup].interval_hours = 24; raise the threshold if you lengthened the interval."

      - alert: BackupRunsFailing
        expr: increase(plombir_git_db_backups_total{status="failed"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
          service: plombir-git
        annotations:
          summary: "Scheduled database backup run failed"
          description: "{{ $value }} failed run(s) in the last hour. The warning in the server log names the directory and the cause."
