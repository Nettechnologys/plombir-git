# cargo-deny configuration for Plombir Git.
# Run locally with `cargo deny check`. Enforced in CI (see .github/workflows).
#
# Three gates:
#   * advisories — RustSec vulnerabilities / unmaintained crates (security).
#   * licenses   — only OSI-approved permissive licenses are allowed in the tree.
#   * bans       — deny.toml can pin/deny specific crates; here it only warns.

[graph]
# Evaluate the same dependency set the workspace actually builds.
all-features = true

# ─────────────────────────────── Advisories ───────────────────────────────
[advisories]
# `version = 2` drops the deprecated per-severity thresholds; unignored
# vulnerabilities and unmaintained crates fail the check.
version = 2
# An ignore whose crate has left the tree is a standing pre-approval: the day
# the crate comes back, its advisory is waived without anyone looking. Fail on
# it instead, so the list only ever holds what the tree really carries.
unused-ignored-advisory = "deny"
# Consciously accepted advisories with no fixed release. Keep in sync with
# `.cargo/audit.toml` and `osv-scanner.toml`; each entry documents why the exposure is acceptable.
ignore = [
    # rsa "Marvin Attack" timing side-channel (no patched release: `patched = []`).
    # Reaches us via two paths: `sqlx-mysql` RSA auth (server-to-DB) and `russh`
    # SSH host/user RSA keys (rsa 0.10.0-rc). Both use RSA for signatures/auth;
    # neither exposes an attacker-controlled RSA *decryption* oracle (SSH kex is
    # curve25519/ECDH, not RSA key transport) — the specific vector Marvin
    # exploits. Revisit when `rsa` ships a constant-time release.
    "RUSTSEC-2023-0071",
    # crypto-bigint timing variability: patched only on the 0.7 line (we take
    # 0.7.9), no patched 0.5.x. 0.5.5 comes from jsonwebtoken's `rust_crypto`
    # p256 / p384 (elliptic-curve 0.13) and the test-only P-256 authenticator.
    # Production JWTs are HS256 and EdDSA only and no EC key is ever built, so
    # the affected arithmetic never touches a secret of ours. Revisit when
    # jsonwebtoken moves to elliptic-curve 0.14.
    "RUSTSEC-2026-0387",
]

# ──────────────────────────────── Licenses ────────────────────────────────
[licenses]
version = 2
# Confidence required for the license detector to accept a text match.
confidence-threshold = 0.8
# OSI-approved permissive licenses only. Plombir Git itself is AGPL-3.0-or-later,
# and every entry here is AGPL-compatible; keeping dependencies permissive also
# keeps the commercial-license option (see NOTICE) free of third-party
# copyleft. Extend deliberately when a new dependency needs it.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Mozilla root-certificate data bundled by webpki-roots (permissive).
    "CDLA-Permissive-2.0",
    "Unlicense",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
]

# Plombir Git's own crates carry the project license. AGPL is allowed for them by
# name only, so a copyleft *dependency* still fails the gate above.
exceptions = [
    { name = "rg-ci", allow = ["AGPL-3.0-or-later"] },
    { name = "rg-cli", allow = ["AGPL-3.0-or-later"] },
    { name = "rg-core", allow = ["AGPL-3.0-or-later"] },
    { name = "rg-db", allow = ["AGPL-3.0-or-later"] },
    { name = "rg-db-migration", allow = ["AGPL-3.0-or-later"] },
    { name = "rg-git", allow = ["AGPL-3.0-or-later"] },
    { name = "rg-http", allow = ["AGPL-3.0-or-later"] },
    { name = "rg-mcp", allow = ["AGPL-3.0-or-later"] },
    { name = "rg-process", allow = ["AGPL-3.0-or-later"] },
    { name = "rg-runner", allow = ["AGPL-3.0-or-later"] },
    { name = "rg-ssh", allow = ["AGPL-3.0-or-later"] },
]

# ────────────────────────────────── Bans ──────────────────────────────────
[bans]
# Duplicate versions are common in a large tree (transitive semver skew); warn
# rather than fail so the gate stays about security, not housekeeping noise.
multiple-versions = "warn"
wildcards = "allow"
# One TLS stack: rustls. OpenSSL and libcurl must not re-enter the graph through
# a default feature (reqwest, ldap3, gix) — the check fails the moment one does.
# `openssl-sys` is allowed only through webauthn-rs-core and webauthn-attestation-ca,
# which depend on it unconditionally (not behind a feature), and the `openssl`
# crate they use. Removing that path means replacing webauthn-rs, a decision of
# its own, not a feature flag. That decision was taken on 2026-10-15: the
# exception stays, and it covers exactly these three wrappers. Any other route
# to `openssl-sys` is a new decision, not an edit to this list.
deny = [
    { name = "openssl-sys", wrappers = ["openssl", "webauthn-rs-core", "webauthn-attestation-ca"], reason = "TLS is rustls only; the one allowed path is webauthn-rs's unconditional openssl dependency" },
    { name = "curl-sys", reason = "gix runs without its curl transport; git traffic goes through the git CLI" },
]

# ───────────────────────────────── Sources ────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# crates.io is the only registry Plombir Git pulls from.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
