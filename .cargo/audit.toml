# cargo-audit configuration — see https://docs.rs/cargo-audit
#
# Every entry here is an ADVISORY WE HAVE CONSCIOUSLY ACCEPTED because no fixed
# release exists yet and the exposure in Plombir Git is low. Each carries a reason
# and, where relevant, the follow-up. Keep this list in sync with deny.toml and
# osv-scanner.toml (scripts/advisory-ignore-list-contract-check.mjs).
[advisories]
ignore = [
    # rsa "Marvin Attack" timing side-channel — NO patched release exists
    # (RustSec `patched: []`). Reaches us via TWO paths: `sqlx-mysql`'s RSA auth
    # (caching_sha2 public-key exchange, server-to-DB) and `russh` SSH host/user
    # RSA keys (rsa 0.10.0-rc). Both use RSA for signatures/auth; neither
    # exposes an attacker-controlled RSA *decryption* oracle (SSH kex is
    # curve25519/ECDH, not RSA key transport) — the exact vector Marvin exploits.
    # Revisit when the `rsa` crate ships a constant-time fix or both drop it.
    "RUSTSEC-2023-0071",
    # crypto-bigint timing variability — fixed only on the 0.7 line (>= 0.7.6,
    # we take 0.7.9); NO patched 0.5.x exists. 0.5.5 reaches us only through
    # jsonwebtoken's `rust_crypto` backend (p256 / p384 for ES256 / ES384,
    # elliptic-curve 0.13 — jsonwebtoken 11.1 still pins it) and the test-only
    # P-256 software authenticator in rg-http. Production code signs and verifies
    # with HS256 secrets and EdDSA keys only; no EC key is ever built, so the
    # affected arithmetic never runs on a secret of ours. Revisit when
    # jsonwebtoken moves to elliptic-curve 0.14 or we drop its EC algorithms.
    "RUSTSEC-2026-0387",
]
