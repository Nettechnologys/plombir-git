# cargo-audit configuration — see https://docs.rs/cargo-audit
#
# Every entry here is an ADVISORY WE HAVE CONSCIOUSLY ACCEPTED: a patched
# release is either unavailable or not admitted by the current dependency graph,
# and the documented exposure is accepted. Each carries a reason and follow-up.
# Keep this list in sync with deny.toml and osv-scanner.toml
# (scripts/advisory-ignore-list-contract-check.mjs).
[advisories]
ignore = [
    # rsa "Marvin Attack" timing side-channel — NO patched release exists
    # (RustSec `patched: []`). Reaches us via TWO paths: `sqlx-mysql`'s RSA auth
    # (caching_sha2 public-key exchange, server-to-DB) and `russh` SSH host/user
    # RSA keys (rsa 0.10.0-rc). Both use RSA for signatures/auth; neither
    # exposes an attacker-controlled RSA *decryption* oracle (SSH kex is
    # curve25519/ECDH, not RSA key transport) — the exact vector Marvin exploits.
    # Revisit when the `rsa` crate ships a constant-time fix or both drop it.
    "RUSTSEC-2023-0071",
    # crypto-bigint timing variability — fixed only on the 0.7 line (>= 0.7.6,
    # we take 0.7.9); NO patched 0.5.x exists. 0.5.5 reaches us only through
    # jsonwebtoken's `rust_crypto` backend (p256 / p384 for ES256 / ES384,
    # elliptic-curve 0.13 — jsonwebtoken 11.1 still pins it) and the test-only
    # P-256 software authenticator in rg-http. Production code signs and verifies
    # with HS256 secrets and EdDSA keys only; no EC key is ever built, so the
    # affected arithmetic never runs on a secret of ours. Revisit when
    # jsonwebtoken moves to elliptic-curve 0.14 or we drop its EC algorithms.
    "RUSTSEC-2026-0387",
    # SQLite: libsqlite3-sys 0.30.1 bundles affected SQLite 3.46. A fixed crate
    # exists (>= 0.39), but SQLx 0.8.6 requires ^0.30.1; the assessed SQLx 0.9
    # release still excludes >= 0.38 and raises MSRV to 1.94. There is no
    # supported compatible update in that released dependency chain.
    # Exploitation requires an attacker-written database and WAL pair to be
    # opened. Production database paths are operator-controlled; the server
    # does not accept untrusted SQLite uploads. Keep the data directory and
    # restore inputs trusted. Restore-sidecar handling remains a follow-up.
    # This exception does not fix SQLite. Revisit when SQLx admits a patched
    # libsqlite3-sys, or if the database/restore trust boundary changes.
    # Follow-ups: card_9883212e9192 (update), card_f8e122ff4fd8 (restore sidecars).
    "RUSTSEC-2026-0459",
]
